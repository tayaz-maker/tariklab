  function geomFor(size, big) {
    var m = Math.max(2, (size * 0.008) | 0);
    var board = size - 2 * m;
    var D = board * (big ? 0.185 : 0.225);
    if (D < 42) D = 42;
    if (D > board * 0.26) D = board * 0.26;
    var inner = board - 2 * D;
    if (inner < 110) {
      D = (board - 110) / 2;
      inner = board - 2 * D;
    }
    return { m: m, D: D, board: board, inner: inner, tw: inner / 9 };
  }
  function tileRect(i, g) {
    var m = g.m, D = g.D, tw = g.tw, B = g.board;

    var r;
    if (k === 0) {
      if (side === 0) r = { x: m + B - D, y: m + B - D };
      else if (side === 1) r = { x: m, y: m + B - D };
      else if (side === 2) r = { x: m, y: m };
      else r = { x: m + B - D, y: m };

    else if (side === 2) r = { x: m + D + (k - 1) * tw, y: m, w: tw, h: D };
    else r = { x: m + B - D, y: m + D + (k - 1) * tw, w: D, h: tw };

  function ringPt(i, size, big, rad) {
    var g = geomFor(size, !!big);
    var r = tileRect(i, g);
    var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    if (r.k === 0) {
      var ox = r.w * 0.16, oy = r.h * 0.2;
      if (r.side === 0) return { x: cx + ox, y: cy + oy };
      if (r.side === 1) return { x: cx - ox, y: cy + oy };
      if (r.side === 2) return { x: cx - ox, y: cy - oy };
      return { x: cx + ox, y: cy - oy };
    }
    var o = 0.30;
    if (r.side === 0) cy += r.h * o;
    else if (r.side === 1) cx -= r.w * o;
    else if (r.side === 2) cy -= r.h * o;
    else cx += r.w * o;
    var pad = (rad || 0) + 2.5;
    cx = Math.min(Math.max(cx, r.x + pad), r.x + r.w - pad);

  function tileAt(x, y, canvas) {
    var box = canvas.getBoundingClientRect();

    var size = Math.min(box.width, box.height);
    var ox = (box.width - size) / 2, oy = (box.height - size) / 2;
    var big = !!(canvas.parentElement && canvas.parentElement.id === "sheet");
    var g = geomFor(size, big);
    var lx = px - ox, ly = py - oy;
    var i, tr, best = -1, bd = 1e9, p, d;
    for (i = 0; i < 40; i++) {

    }
    for (i = 0; i < 40; i++) {
      p = ringPt(i, size, big);

    bar.style.background = COL[t.g] || "#C4A574";
    if (!t.g) bar.style.background = "#2A2620";
    add(box, el("h1", { text: t.name }));
    add(box, el("p", { cls: "grp", text: t.g ? GRP_TR[t.g] : t.kind === "K" ? "Kaçış" : t.kind === "U" ? "Kurum" : t.kind === "X" ? "Tahsil" : "Köşe" }));
    function kv(parent, a, b) {
      var n = add(parent, el("div", { cls: "kv" }));
      add(n, el("em", { text: a }));
      add(n, el("b", { text: b }));
      return n;
    }
    if (t.kind === "T" && RENT[t.name]) {
      var tb = RENT[t.name], grid = add(box, el("div", { cls: "grid" })), li;
      for (li = 0; li < LVL.length; li++) kv(grid, LVL[li], tl(tb[li]));
      add(box, el("div", { cls: "foot", text: "Liste " + tl(t.price) + " · Dik " + tl(BUILD_COST[t.g]) }));
    } else if (t.kind === "K") {
      var kg = add(box, el("div", { cls: "grid" }));
      kv(kg, "1 şapka", tl(25));
      kv(kg, "2’de", tl(50));
      kv(kg, "3’te", tl(100));
      kv(kg, "4’te", tl(200));
      add(box, el("div", { cls: "foot", text: "Liste " + tl(t.price) }));
    } else if (t.kind === "U") {
      var ug = add(box, el("div", { cls: "grid" }));
      kv(ug, "Birinde", "zar ×4");
      kv(ug, "İkisinde", "zar ×10");
      add(box, el("div", { cls: "foot", text: "Liste " + tl(t.price) }));
    } else {
      var rows = add(box, el("div", { cls: "rows" }));
      if (t.kind === "X") rows.textContent = "Öde " + tl(t.price);
      else if (t.kind === "C") rows.textContent = "Geç veya in, +" + tl(200) + ".";
      else if (t.kind === "J") rows.textContent = "3 kaçış, " + tl(50) + ", çift veya çıkış.";
      else if (t.kind === "B") rows.textContent = "Nezaret. " + tl(200) + " yok.";
      else if (t.kind === "O") rows.textContent = "Otur. Bekle.";
      else if (t.kind === "R") rows.textContent = "Racon çek.";
      else if (t.kind === "I") rows.textContent = "İhbar çek.";
    }
    var st = stampOf(i);
    if (st) {
      var canLift = S && st === "SENETLİ" && S.own[i] === S.turn && !humanLocked() && S.cash[S.turn] >= unsenetCost(i);
      if (canLift) add(box, el("button", { cls: "stamp", text: st, "data-act": "unsen" }));
      else add(box, el("div", { cls: "stamp", text: st }));
    }
  }

  function btn(label, code, primary) {
    var b = el("button", { text: label, "data-act": code });
    if (primary) b.className = "primary";
    return b;
  }

  function paintDock() {
    var chips = document.getElementById("chips");
    var banner = document.getElementById("banner");
    var acts = document.getElementById("acts");
    clear(chips); clear(banner); clear(acts);
    if (!S) return;
    var n = nP(), i;
    chips.className = n > 2 ? "many" : "";
    for (i = 0; i < n; i++) {
      var sp = el("span");
      if (i === S.turn && S.win == null) sp.className = "me";
      if (S.dead && S.dead[i]) sp.className = (sp.className ? sp.className + " " : "") + "dead";
      sp.appendChild(document.createTextNode(tag(i) + " "));
      add(sp, el("b", { text: tl(S.cash[i]) }));
      chips.appendChild(sp);
    }
    if (S.win != null) {
      if (sen(S.win)) banner.textContent = "SEN KAZANDIN";
      else if (isAi(S.win)) banner.textContent = "NACİ BEY KAZANDI";
      else if (S.n === 2) banner.textContent = S.win === 0 ? "SEN KAZANDIN" : "KARŞI KAZANDI";
      else banner.textContent = (S.win + 1) + ". KAZANDI";
    } else if (S.wait === "auc") {
      banner.textContent = "AÇIK ARTIRMA";
    } else if (S.wait === "offer") {
      banner.textContent = "TAKAS";
    } else if (isAi(S.turn)) {
      banner.textContent = "NACİ BEY";
    } else if (S.len === "short" && S.stat && S.stat.turns >= shortLimit() - 5) {
      banner.textContent = "SON " + Math.max(1, shortLimit() - S.stat.turns) + " EL";
    } else if (S.n === 2 || S.mode === "cpu") {
      banner.textContent = S.turn === 0 ? "SENİN TURUN" : "KARŞI TARAF";
    } else {
      banner.textContent = (S.turn + 1) + ". OYUNCU";
    }
    acts.className = "";
    if (S.win != null) {
      add(acts, btn("Yeni oyun", "new", true));
      add(acts, btn("Ana menü", "new"));
      return;
    }
    if (S.wait === "offer") {
      add(acts, btn("Kabul", "tyes", true));
      add(acts, btn("Ret", "tno"));
      return;
    }
    if (S.wait === "auc") {
      if (!S.auc || isAi(S.auc.turn)) return;
      var nb = nextAucBid();
      var can = S.cash[S.auc.turn] >= nb;
      var ab = add(acts, btn(can ? "Artır · " + tl(nb) : "Kasa yetmez", "aup", can));
      ab.disabled = !can;
      var fb = add(acts, btn("Çekil", "aun", !can));
      if (S.auc.by === S.auc.turn) { fb.disabled = true; fb.setAttribute("aria-disabled", "true"); }
      return;
    }
    if (isAi(S.turn)) return;
    var w = S.wait;
    var p = S.turn;
    if (w === "pass") {
      banner.textContent = ("Sıra " + who(S.turn) + " oyuncuda").toLocaleUpperCase("tr-TR");
      add(acts, btn("Hazırım", "tamam", true));
      return;
    }
    if (w === "jail") {
      acts.className = "stack";
      if (S.cik[p] > 0) add(acts, btn("Çıkış", "cik", true));
      var row = add(acts, el("div"));
      row.style.display = "flex"; row.style.gap = "16px";
      add(row, btn("Zar at", "roll", true));
      add(row, btn("50 TL öde", "jail50"));
      return;
    }
    if (w === "roll") {
      acts.className = "stack";
      add(acts, btn("Zar at", "roll", true));
      var r2 = add(acts, el("div"));
      r2.style.display = "flex"; r2.style.gap = "16px";
      add(r2, btn("Takas", "trade"));
      add(r2, btn("Tapularım", "tapu"));
      return;
    }
    if (w === "buy") {
      var price = sq(S.pos[p]).price, can = S.cash[p] >= price;
      var ab = add(acts, btn(can ? "Al · " + tl(price) : "Kasa yetmez", "al", can));
      ab.disabled = !can;
      add(acts, btn("Geç", "gec", !can));
      return;
    }
    if (w === "pay") { add(acts, btn("Öde · " + tl(landRent(S.pos[p])), "ode", true)); return; }
    if (w === "own") {
      if (buildTargets(p).length) add(acts, btn("Dik", "dik", true));
      add(acts, btn("Bitir", "bitir"));
      return;
    }
    if (w === "card" || w === "ok") { add(acts, btn("Tamam", "tamam", true)); return; }
  }

  function paintMenu() {
    closeSheet();
    var m = document.getElementById("menu");
    clear(m); m.className = "on";
    m.setAttribute("data-len", tmpLen);
    m.setAttribute("data-lvl", tmpLvl);
    m.setAttribute("data-snd", sndPref() ? "1" : "0");
    var topRow = add(m, el("header", { cls: "menu-top" }));
    add(topRow, el("a", { href: "/", cls: "hint", text: "← Oyunlar", style: "display:inline-block;text-decoration:none" }));
    if (window.tlabI18n) window.tlabI18n.mountLangToggle(topRow);
    add(m, el("h1", { text: "SON MAHALLE BÜKÜCÜ" }));
    add(m, el("p", { cls: "sub", text: "İstanbul tapusu. Semti tutan büker." }));
    add(m, el("p", { cls: "hint", text: "Kayıt yerleri" }));
    var slotRow = add(m, el("div", { cls: "row" }));
    [1, 2, 3].forEach(function (n) {
      var rawN = null;
      try { rawN = localStorage.getItem("tariklab::bukucu:" + n); } catch (e) {}
      var filled = false;
      if (rawN) { try { JSON.parse(rawN); filled = true; } catch (e) { filled = false; } }
      add(slotRow, el("button", { text: "Slot " + n + (filled ? " · dolu" : " · boş"), "data-act": "slot:" + n, cls: SLOT === n ? "pick" : "" }));
    });
    var st = add(m, el("div", { cls: "stack" }));
    var raw = loadRaw();
    var ok = false;
    if (raw) { try { JSON.parse(raw); ok = true; } catch (e) { ok = false; } }
    if (ok) {
      add(st, btn("Devam et", "cont", true));
      add(st, btn("Yeni oyun", "new"));
    } else {
      add(st, el("p", { cls: "hint", text: "Süre" }));
      var lenRow = add(st, el("div", { cls: "row" }));
      add(lenRow, el("button", { text: "Kısa", "data-act": "len:short", cls: tmpLen === "short" ? "pick" : "" }));
      add(lenRow, el("button", { text: "Uzun", "data-act": "len:long", cls: tmpLen === "long" ? "pick" : "" }));
      add(st, el("p", { cls: "hint", text: "Naci" }));
      var lvlRow = add(st, el("div", { cls: "row" }));
      add(lvlRow, el("button", { text: "Acemi", "data-act": "lvl:acemi", cls: tmpLvl === "acemi" ? "pick" : "" }));
      add(lvlRow, el("button", { text: "Esnaf", "data-act": "lvl:esnaf", cls: tmpLvl === "esnaf" ? "pick" : "" }));
      add(lvlRow, el("button", { text: "Bükücü", "data-act": "lvl:bukucu", cls: tmpLvl === "bukucu" ? "pick" : "" }));
      add(st, btn("Naci Bey’e karşı", "cpu", true));
      add(st, btn("İki insan, aynı telefon", "hot"));
      add(st, btn("Üç insan, aynı telefon", "hot3"));
      add(st, btn("Dört insan, aynı telefon", "hot4"));
    }
    add(st, btn("Nasıl oynanır", "rules"));
    add(st, el("button", { text: sndPref() ? "Ses açık" : "Ses kapalı", "data-act": "snd", cls: sndPref() ? "pick" : "" }));
    add(m, el("p", { cls: "plus", text: "18+ kurgu · başla 1.500 TL" }));
    var credit = add(m, el("p", { cls: "plus" }));
    credit.innerHTML = "© 2026 TarikLab. Tüm hakları saklıdır.<br>Oyun tasarımı ve özgün içerik: Tarık Halil Ayaz.";
    document.getElementById("app").style.visibility = "hidden";
    document.getElementById("app").classList.remove("handoff");
    if (window.tlabI18n && window.tlabI18n.getLang() !== "tr") window.tlabI18n.applyPhrases(m);
  }

  function paintEnd() {
    peek = -1;
    var body = sheetHead("BİTTİ");
    var winLine = senSoz(S.win) ? "Sen kazandın." : (isAi(S.win) ? "Naci Bey kazandı." : who(S.win) + " kazandı.");
    if (S.len === "short") winLine += " Kısa oyun.";
    add(body, el("p", { cls: "sum", text: winLine }));
    var n = nP(), i, rp, card, best = S.win;
    if (best == null) {
      best = 0;
      for (i = 1; i < n; i++) if (netOf(i) > netOf(best)) best = i;
    }
    function line(p, a, b) {
      var r = add(p, el("div", { cls: "kv" }));
      add(r, el("span", { text: a }));
      add(r, el("b", { text: b }));
    }
    for (i = 0; i < n; i++) {
      card = add(body, el("div", { cls: i === best ? "endcard win" : "endcard" }));
      add(card, el("div", { cls: "who", text: tag(i) + (i === S.win ? " · kazandı" : "") }));
      line(card, "Kasa", tl(S.cash[i]));
      line(card, "Tapu", String(ownedList(i).length));
      line(card, "Bina", String(bldCount(i)));
      rp = (S.stat && S.stat.rentPaid && S.stat.rentPaid[i]) || 0;
      line(card, "Ödenen kira", tl(rp));
      line(card, "Net servet", tl(netOf(i)));
    }
    var ops = add(body, el("div", { cls: "ops" }));
    add(ops, btn("Yeni oyun", "new", true));
    add(ops, btn("Ana menü", "new"));
  }

  function paint() {
    if (view === "menu" || !S) { paintMenu(); return; }
    document.getElementById("menu").className = "";
    document.getElementById("app").style.visibility = "visible";
    document.getElementById("app").classList.toggle("handoff", !!(S && S.wait === "pass"));
    var show = peek >= 0 ? peek : S.focus;
    paintDeed(show);
    document.getElementById("log").textContent = S.log || "";
    paintDock();
    drawRing();
    if (view === "end" || S.win != null) paintEnd();
    if (window.tlabI18n && window.tlabI18n.getLang() !== "tr") window.tlabI18n.applyPhrases(document.body);
  }

  window.addEventListener("orientationchange", function () { setTimeout(function () { setVvh(); redrawAll(); }, 280); });
  var reT = 0;
  function redrawAll() {
    if (!S || view === "menu") return;
    drawRing();
    var sc = document.querySelector("#sheet canvas");
    if (sc) drawRingOn(sc, true);
  }
  function scheduleRedraw() {
    if (reT) return;
    reT = requestAnimationFrame(function () { reT = 0; redrawAll(); });
  }
  window.addEventListener("resize", scheduleRedraw, { passive: true });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleRedraw, { passive: true });
  if (window.ResizeObserver) {
    try {
      var ro = new ResizeObserver(scheduleRedraw);
      ro.observe(document.getElementById("ring"));
      ro.observe(document.getElementById("sheet"));
    } catch (e) {}
  }

  try {
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
        if (reg && reg.update) return reg.update();
      }).catch(function () {});
    }
  } catch (e) {}

  (function boot() {
    view = "menu";
    paintMenu();
    var raw = loadRaw();
    if (raw) {
      try { JSON.parse(raw); } catch (e) { wipe(); paintMenu(); }
    }
  })();
})();
</script>
</body>
</html>
