  function encodeSave(data) {

      "Kayıt: " + new Date((data.savedAt || Date.now())).toISOString(),

  function parseTextSave(raw) {
    var cut = raw.indexOf("\n---\n");

    var end = rest.lastIndexOf("\n---");
    var payload = (end >= 0 ? rest.slice(0, end) : rest).replace(/^\s+|\s+$/g, "");

    if (!data) return "corrupt";
    var sumM = /SUM:\s*([0-9a-f]+)/i.exec(head);

    return data;
  }
  function parseSave(raw) {

    var obj;
    try { obj = JSON.parse(raw); } catch (e) { return "corrupt"; }
    if (obj && obj.kind === SAVE_KIND && obj.data) {
      var data = migrate(obj.data);
      if (!data) return "corrupt";
      if (obj.sum && obj.sum !== fnvHex(JSON.stringify(obj.data))) data._sumWarn = true;
      return data;

  function genMan(rng, year, home, locked) {
    var age = 19 + ri(rng, 22);
    var role = pick(rng, ROLES);
    var st = {};
    for (var i = 0; i < STATS.length; i++) st[STATS[i]] = 5 + ri(rng, 12);
    if (role === "Tetikçi") st.sert += 3;
    if (role === "Fedai") st.sadakat += 3;
    if (role === "Gözcü") st.soguk += 3;
    if (role === "Sürücü") st.cevik += 3;
    if (role === "Avukat") st.soz += 3;
    var t1 = TRAITS[ri(rng, TRAITS.length)][0];
    var t2 = TRAITS[ri(rng, TRAITS.length)][0];
    if (t2 === t1) t2 = TRAITS[(TRAITS.findIndex(function (x) { return x[0] === t1; }) + 3) % TRAITS.length][0];
    return {
      id: "m" + (rng() * 1e9 | 0).toString(16),
      ad: pick(rng, ADLAR) + " " + pick(rng, SOY),
      lakap: "",
      semt: pick(rng, REGIONS[home ? home.r : ri(rng, 7)].d),
      dogum: year - age,
      yas: age,
      rol: role,
      st: st,
      traits: [t1, t2],
      hp: 10,
      maxHp: 10,
      yorgun: 0,
      yevmiye: 8000 + ri(rng, 12000),
      sozlesme: 1 + ri(rng, 4),
      bag: null,
      yara: [],

      carry: 0,
      locked: !!locked,
      favori: false

  function genGangs(rng, home) {
    var out = [];
    var used = {};
    for (var i = 0; i < 48; i++) {
      var r = ri(rng, 7);
      var d = ri(rng, REGIONS[r].d.length);
      var nm = REGIONS[r].d[d] + " " + pick(rng, GANG_WORD);
      if (used[nm]) nm = nm + " " + (i + 1);
      used[nm] = 1;
      var tier = i < 16 ? 0 : i < 28 ? 1 : i < 38 ? 2 : i < 44 ? 3 : i < 47 ? 4 : 5;
      out.push({
        id: "g" + i,
        name: nm,
        r: r,
        d: d,
        tier: tier,
        pts: ri(rng, 8),
        power: 8 + tier * 3 + ri(rng, 6)
      });
    }
    var derby = null;
    for (var j = 0; j < out.length; j++) {
      if (out[j].r === home.r && out[j].d === home.d && out[j].tier === 0) {
        derby = out[j];
        break;
      }
    }
    if (!derby) {
      derby = out[0];
      derby.r = home.r;
      derby.d = home.d;
      derby.name = REGIONS[home.r].d[home.d] + " " + GANG_WORD[0];
      derby.tier = 0;
    }
    return { gangs: out, derby: derby.id };
  }

    if (roles.Gözcü && roles.Sürücü) s.push("Kaçış Gözü");

      var baba = genMan(rng, year, tmpHome, true);
      baba.ad = "Baba " + pick(rng, ADLAR);
      baba.yas = 52;
      baba.dogum = year - 52;
      baba.rol = "Baba adayı";
      baba.sozlesme = 9;
      var o1 = genMan(rng, year, tmpHome, true);
      var o2 = genMan(rng, year, tmpHome, true);
      o1.bag = { tur: "kardes", id: o2.id };
      o2.bag = { tur: "kardes", id: o1.id };
      o1.yas = 23; o2.yas = 21;
      draftPool.push(baba, o1, o2);
      draftPick = [baba.id, o1.id, o2.id];
    }
    for (i = 0; i < 16; i++) draftPool.push(genMan(rng, year, tmpHome, false));
    if (tmpMode === "sokak") {
      for (i = 0; i < draftPool.length; i++) {
        draftPool[i].yas = Math.min(47, draftPool[i].yas + 8);
        draftPool[i].st.sert += 2;
        draftPool[i].st.sadakat = Math.max(3, draftPool[i].st.sadakat - 4);
      }
    }
    view = "draft";
    paint();
  }
  var tmpSeed = 1;

  function commitDraft() {
    var need = tmpMode === "hanedan" ? 8 : 8;
    if (draftPick.length !== need) {
      toast("Sekiz adam seç.");
      return;
    }
    var men = [];
    for (var i = 0; i < draftPool.length; i++) {
      if (draftPick.indexOf(draftPool[i].id) !== -1) men.push(draftPool[i]);
    }
    if (men.length !== 8) {
      toast("Sekiz adam seç.");
      return;
    }
    var old = loadSave();
    if (old && old !== "corrupt" && old.run && !tmpWipeOk) {
      openModal(
        "Üzerine yazılsın mı?",
        saveLabel(old) + " bu cihazdan silinir. Yedek aldın mı?",
        [["Yaz", "draftforce"], ["Vazgeç", "close"]]
      );
      return;
    }
    tmpWipeOk = false;
    men[0].favori = true;
    if (men.length > 2) {
      men[1].bag = { tur: "dost", id: men[2].id };
      men[2].bag = { tur: "dost", id: men[1].id };
    }
    men[men.length - 1].sozlesme = 1;
    S = newState(tmpMode, tmpName.replace(/^\s+|\s+$/g, "") || "Hanedan", tmpHome, men, tmpSeed);
    var der = null;
    for (i = 0; i < S.gangs.length; i++) if (S.gangs[i].id === S.fixture) der = S.gangs[i];
    kronik("1958, " + districtName(S.home) + ". Semt henüz bu isimle anılmıyordu. Kan döküldü, isim yazılmadı.");
    kronik("1968. Patron düştü. Çocukları dağıldı. Defter kapanmadı.");
    kronik("1977 kışı. Kahvehane yine açıldı. Yeni isim bekleniyor.");
    kronik("Hanedan " + S.name + " " + districtName(S.home) + " semtinde kuruldu. Yıl " + yearNow() + ".");
    haber("Yeni isim", S.name + " deftere yazıldı. Ev: " + districtName(S.home) + ".");
    haber("Derbi", (der ? der.name : "Rakip") + " ilk haftadan aynı semtte. Islak sokak beklenir.");
    S.prep.squad = autoSquad();
    rollMarket();
    view = "play";
    tab = "baskin";
    saveNow();
    paint();
    toast("İlk derbi bu hafta. Ölüm masada.");
  }

  function currentOpp() {
    for (var i = 0; i < S.gangs.length; i++) if (S.gangs[i].id === S.fixture) return S.gangs[i];
    return S.gangs[0];
  }
  function currentSquadMen() {
    var ids = S.prep.squad;
    var a = [];
    for (var i = 0; i < ids.length; i++) {
      var m = manById(ids[i]);
      if (m && m.hp > 0 && m.jail <= 0 && m.sozlesme > 0 && !a.some(function(x){return x.id===m.id;})) a.push(m);
    }
    return a.slice(0, squadSize());
  }

  function simRaid() {
    var rng = rngFrom(hash(S.seed, S.season, S.week, "raid"));
    var opp = currentOpp();
    var derby = opp.r === S.home.r && opp.d === S.home.d;
    var cond = CONDITIONS[hash(S.seed, S.week, "c") % CONDITIONS.length];
    if (S.week === 1) cond = CONDITIONS[0];
    var roomsN = 3 + ri(rng, 4);
    var squad = JSON.parse(JSON.stringify(currentSquadMen()));
    if (!squad.length) return null;
    var crewIds = squad.map(function(m){return m.id;});
    var syn = synergies(squad);
    var gambit = S.prep.gambit;
    var kit = S.prep.kit;
    var rooms = [];
    var loot = 0;
    var heat = derby ? 8 : 5;
    var silentAt = 1 + ri(rng, Math.max(1, roomsN - 1));
    var i, r, m;

    for (r = 0; r < roomsN; r++) {
      squad = squad.filter(function(m){return m.hp > 0;});
      if (!squad.length) break;
      var lines = [];
      var danger = 7 + r * 2 + opp.power / 4 + (derby ? 3 : 0);
      if (cond[0] === "karakol") danger += 2;
      if (cond[0] === "islak") danger += 1;
      if (cond[0] === "elektrik") danger += 1;
      var power = 0;
      for (i = 0; i < squad.length; i++) {
        m = squad[i];
        power += m.st.sert * 0.35 + m.st.soguk * 0.3 + m.st.cevik * 0.2 + m.st.sadakat * 0.15;
        power -= m.yorgun * 0.4;
        if (hasT(m, "korkak") && r > 0) power -= 2;
        if (hasT(m, "delidolu")) power += 1;
        if (hasT(m, "keskin") && gambit === "ilkates") power += 2;
        if (hasT(m, "alkol") && cond[0] === "islak") power -= 2;
        if (hasT(m, "dindar") && (cond[0] === "cuma" || cond[0] === "ramazan")) power += 1;
        if (hasT(m, "davaci") && cond[0] === "davas") power += 2;
        if (hasT(m, "muhbir") && cond[0] === "karakol") power -= 2;
        if (hasT(m, "ugurlu")) power += 1;
      }
      if (gambit === "onde" && r === 0) power += 4;
      if (gambit === "arkada" && r === roomsN - 1) power += 3;
      if (gambit === "ilkates" && r === 0) power += 5;
      if (gambit === "kacis") power += 1;
      if (gambit === "ganimet") power -= 1;
      if (gambit === "esir") power -= 2;
      if (kit === "fener" && cond[0] === "elektrik") power += 3;
      if (kit === "arac" && gambit === "kacis") power += 2;
      if (syn.indexOf("Pencere Çifti") !== -1) power += 3;
      if (syn.indexOf("Duvar") !== -1) power += 2;
      if (syn.indexOf("Çifte Namlu") !== -1 && r === 0) power += 3;
      if (syn.indexOf("Kan Sözü") !== -1) power += 2;
      if (S.bld.silahhane) power += S.bld.silahhane;
      var margin = power - danger + (rng() * 8 - 4);
      var hit = margin < 2;
      var deadHere = [];
      var woundHere = [];
      lines.push("Oda " + (r + 1) + ". " + cond[1] + ".");
      if (derby) lines.push("Derbi semti. " + opp.name + " evinde.");
      if (gambit === "onde") lines.push(squad[0].ad + " önde durdu.");
      if (syn.length && r === 0) lines.push("Sinerji: " + syn.join(", ") + ".");
      if (hit) {
        var victim = squad[ri(rng, squad.length)];
        if (hasT(victim, "korkak") && rng() > 0.4) {
          lines.push(victim.ad + " geri kaçtı. Emir ezilmedi, oda boşaldı.");
          victim.yorgun += 2;
        } else {
          var cover = null;
          for (i = 0; i < squad.length; i++) {
            m = squad[i];
            if (m.id === victim.id) continue;
            if (m.bag && m.bag.id === victim.id && m.bag.tur !== "dava") cover = m;
            else if (hasT(m, "sadik") && !hasT(m, "kiskan") && !hasT(m, "taskalp")) cover = cover || m;
          }
          if (gambit === "koru" && S.prep.koru) {
            var km = squad.find(function(m){return m.id === S.prep.koru && m.hp > 0;});
            if (km && km.id !== victim.id) cover = km;
          }
          if (cover && !hasT(cover, "kiskan") && rng() > 0.25) {
            lines.push(cover.ad + " " + victim.ad + " için siper aldı.");
            victim = cover;
          }
          var dmg = 3 + ri(rng, 5);
          if (hasT(victim, "agir")) dmg -= 1;
          if (kit === "sargi") dmg -= 1;
          if (S.staff.doktor) dmg -= 1;
          victim.hp -= dmg;
          victim.yara.push("oda " + (r + 1));
          victim.yara = victim.yara.slice(-20);
          woundHere.push(victim.ad);
          if (victim.hp <= 0) {
            var fedaiNear = false;
            for (i = 0; i < squad.length; i++) if (squad[i].rol === "Fedai" || squad[i].rol === "Cankurtaran") fedaiNear = true;
            if (fedaiNear && rng() > 0.45) {
              victim.hp = 1;
              victim.yara.push("ağır");
              lines.push(victim.ad + " düştü. Fedai taşıdı. Ağır yara.");
              for (i = 0; i < squad.length; i++) if (squad[i].rol === "Fedai") squad[i].carry += 1;
            } else {
              victim.hp = 0;
              deadHere.push(victim.ad);
              lines.push(victim.ad + " dönmedi.");
            }
          } else {
            lines.push("Kurşun " + victim.ad + " üstüne gitti. Ayakta. −" + dmg + " can.");
          }
        }
      } else {
        lines.push("Oda tutuldu. Kayıp yok.");
        loot += 4000 + ri(rng, 9000);
      }
      if (r === silentAt) {
        lines.push("Sessiz oda. Seçim beklenir.");
      }
      if (gambit === "ganimet" && !hit) loot = Math.round(loot * 1.35);
      if (gambit === "kacis") loot = Math.round(loot * 0.7);
      rooms.push({
        n: r + 1,
        lines: lines,
        nums: { power: Math.round(power), danger: Math.round(danger), margin: Math.round(margin) },
        silent: r === silentAt,
        crew: JSON.parse(JSON.stringify(squad)), loot: loot,
        dead: deadHere,
        wound: woundHere
      });
    }

    var living = 0;
    for (i = 0; i < squad.length; i++) if (squad[i].hp > 0) living++;
    var result = "temiz";
    if (!living) result = "felaket";
    else if (rooms.some(function (x) { return x.dead.length; })) result = "pahalı zafer";
    else if (marginLast(rooms) > 8) result = "ezici";
    else if (marginLast(rooms) < 0) result = "berbat";
    heat += gambit === "polis" ? -4 : 0;
    if(gambit==="esir" && living){loot+=4000;heat-=2;}
    heat += gambit === "ganimet" ? 4 : 0;
    if (cond[0] === "karakol") heat += 5;
    if (kit === "zarf") heat -= 3;
    heat = clamp(heat - S.bld.garaj - S.staff.soforbasi, 1, 18);
    loot += S.bld.depo * 1500;
    if (syn.indexOf("Kaçış Kasası") !== -1) loot += 6000;
    return {
      crewIds: crewIds,
      opp: opp.name,
      derby: derby,
      cond: cond[1],
      syn: syn,
      rooms: rooms,
      result: result,
      loot: loot,
      heat: heat,
      gambit: gambit,
      kit: kit
    };
  }
  function marginLast(rooms) {
    var x = rooms[rooms.length - 1];
    return x ? x.nums.margin : 0;
  }

  function bury(m, last) {
    S.grave.push({
      ad: m.ad,
      yas: m.yas,
      rol: m.rol,
      yara: m.yara.slice(),
      bag: m.bag,
      kitabe: last,
      t: fmtHafta()
    });
    S.grave=S.grave.slice(-80);
    kronik(m.ad + " düştü. " + last);
  }

  function applyRaid(raid, retreated) {
    var ids = raid.crewIds || S.prep.squad;
    var squad = ids.map(manById).filter(Boolean);
    var i, m;
    for (i = 0; i < squad.length; i++) {
      m = squad[i];
      m.yorgun += retreated ? 1 : 2;
      if (m.hp <= 0) {
        bury(m, raid.rooms.map(function (r) { return r.dead.indexOf(m.ad) !== -1; }).indexOf(true) >= 0
          ? "Siper veya oda. Dönmedi."
          : "Baskında kaldı.");
      } else if (m.carry >= 3 && m.rol !== "Cankurtaran") {
        m.rol = "Cankurtaran";
        kronik(m.ad + " yaralı taşıya taşıya Cankurtaran oldu.");
      }
    }
    S.men = S.men.filter(function (x) { return x.hp > 0; });
    S.men.forEach(function(m){if(m.bag && !manById(m.bag.id))m.bag=null;});
    S.prep.squad=S.prep.squad.filter(function(id){return !!manById(id);});
    if (retreated) {
      S.kasa += Math.round(raid.loot * 0.2);
      S.heat = clamp(S.heat + Math.max(2, raid.heat - 2), 0, 100);
      S.pts += 0;
      kronik("Hafta " + S.week + ", " + raid.opp + ". " + raid.cond + ". Çete geri çekildi.");
    } else {
      S.kasa += raid.loot;
      S.heat = clamp(S.heat + raid.heat, 0, 100);
      S.sohret += raid.result === "ezici" ? 3 : raid.result === "felaket" ? -2 : 1;
      S.pts += raid.result === "felaket" ? 0 : raid.result === "berbat" ? 1 : 3;
      if (raid.result === "ezici" && squad[0] && !squad[0].lakap) {
        squad[0].lakap = "Sessiz";
        kronik(squad[0].ad + " lakap kazandı: Sessiz.");
      }
      var sip = "";
      for (i = 0; i < raid.rooms.length; i++) {
        if (raid.rooms[i].dead.length) sip += raid.rooms[i].dead.join(", ") + " dönmedi. ";
      }
      kronik(
        "Hafta " + S.week + ", " + (raid.derby ? "derbi, " : "") + raid.opp + ". " +
        raid.cond + ". " + (raid.syn.length ? raid.syn.join(", ") + ". " : "") +
        sip + "Sonuç: " + raid.result + ". Kasa " + (raid.loot > 0 ? "şişti" : "kımıldamadı") + "."
      );
    }
    raid.retreated = !!retreated;
    raid.awardedLoot = retreated ? Math.round(raid.loot * 0.2) : raid.loot;
    if (retreated) raid.result = "geri çekildi";
    S.archive.unshift(raid);
    if (S.archive.length > 24) S.archive.pop();
    haber(raid.result, raid.opp + " — " + raid.cond + " — " + fmtTL(raid.awardedLoot));
    if (S.kasa < 0) S.kasa = 0;
    if (S.mode === "demir" && (!S.koruyucu.ok || S.bld.kahvehane <= 0)) {
      S.over = true;
      S.overWhy = "Demir kırıldı. Koruyucu veya kahvehane yok.";
    }
    if (!S.men.some(function(m){return m.hp>0;})) {
      S.over = true;
      S.overWhy = "Adam kalmadı.";
    }
  }

  function simLeague() {
    var rng = rngFrom(hash(S.seed, S.season, S.week, "lg"));
    var lines = [];
    for (var i = 0; i < 8; i++) {
      var a = S.gangs[ri(rng, S.gangs.length)];
      var b = S.gangs[ri(rng, S.gangs.length)];
      if (a.id === b.id) continue;
      var aw = rng() > 0.5;
      a.pts += aw ? 3 : 1;
      b.pts += aw ? 1 : 3;
      if (rng() < 0.22) {
        lines.push(a.name + (aw ? " yürüdü: " : " geriledi: ") + b.name + ".");
      }
    }
    if (lines[0]) haber("Mahalle", lines[0]);
  }

  function tickWeekEnd() {
    var i, m;
    var wage = 0;
    for (i = 0; i < S.men.length; i++) {
      m = S.men[i];
      if(m.sozlesme>0)wage += m.yevmiye;
      m.yorgun = clamp(m.yorgun - (1 + S.bld.hamam),0,20);
      if(S.staff.cayci)m.st.sadakat=clamp(m.st.sadakat+0.25,1,20);
      if (m.hp < m.maxHp) m.hp = Math.min(m.maxHp, m.hp + 1 + S.staff.doktor + S.bld.revir);
      if (m.jail > 0) m.jail = Math.max(0,m.jail-1-S.staff.avukat);
    }
    wage = Math.round(wage * Math.pow(0.95,S.bld.ocak));
    S.kasa -= wage;
    S.kasa += 18000 + Math.max(0,S.bld.kahvehane-1)*2000 + S.tier * 8000 + S.staff.kalfa * 6000 + clamp(S.sohret,0,100) * 400;
    if(S.kasa < 0){S.men.forEach(function(m){m.st.sadakat=Math.max(1,m.st.sadakat-2);});haber("Yevmiye açığı","Kasa borçta. Yeni harcamadan önce kadro giderini azalt; sözleşme yenilemeleri bekler.");}
    S.sohret = clamp(S.sohret,0,100);
    S.malzeme = Math.min(40 + S.bld.depo * 15, S.malzeme + 3);
    if (S.heat > 70 && !S.staff.bekci) {
      if (rngFrom(hash(S.seed, S.week, "cafe"))() > 0.65) {
        haber("Kahvehane", "Polis baskısı yüksek. Kapıya üniformalı geldi. Bu hafta oturulmadı.");
        S.kasa -= 25000;
        if (S.mode === "demir" && rngFrom(hash(S.seed, S.week, "burn"))() > 0.85) {
          S.bld.kahvehane = 0;
          S.over = true;
          S.overWhy = "Kahvehane yandı.";
        }
      }
    }
    if (S.heat > 55 && rngFrom(hash(S.seed, S.week, "jail"))() > 0.7 && alive()[0]) {
      var v = alive()[0];
      v.jail = 2;
      haber("Hapis", v.ad + " içeri alındı. İki hafta.");
    }
    S.heat = clamp(S.heat - S.staff.avukat - S.bld.hukuk, 0, 100);
    if (S.kid) {
      S.kidNights += 1;
      if (S.kidNights >= 3 && !S.kid.resolved) {
        S.kid.ready = true;
      }
    } else if (S.week > 4 && rngFrom(hash(S.seed, S.week, "kid"))() > 0.92) {
      S.kid = { ad: pick(rngFrom(hash(S.seed, S.week)), ADLAR) + " oğlu", resolved: false, ready: false };
      S.kidNights = 1;
      haber("Kapı", "Üç gecedir kapıda bir çocuk. Alınır veya reddedilir.");
    }
    if (S.men.length < 24 && S.grave.length && S.season >= 2 && rngFrom(hash(S.seed, S.week, "old"))() > 0.93) {
      var g = S.grave[0];
      var fr = genMan(rngFrom(hash(S.seed, S.week, "fr")), yearNow(), S.home, false);
      fr.ad = g.ad.split(" ")[0] + " yeğeni";
      fr.bag = { tur: "dost", id: "" };
      S.men.push(fr);
      kronik("Eski dostun kanı döndü: " + fr.ad + ".");
    }
    rollMarket();
    nextFixture();
  }

  function rollMarket() {
    var rng = rngFrom(hash(S.seed, S.season, S.week, "mkt"));
    S.market = [];
    for (var i = 0; i < 6; i++) S.market.push(genMan(rng, yearNow(), S.home, false));
  }

  function nextFixture() {
    var rng = rngFrom(hash(S.seed, S.season, S.week + 1, "fx"));
    var same = [];
    for (var i = 0; i < S.gangs.length; i++) {
      if (S.gangs[i].tier === S.tier) same.push(S.gangs[i]);
    }
    if (!same.length) same = S.gangs;
    S.fixture = pick(rng, same).id;
    S.prep.scout = null;
    S.prep.silent = "";
    if (alive().length) S.prep.squad = autoSquad();
  }

  function endSeason() {
    var wasThrone=S.tier===5;
    var i, m;
    S.season += 1;
    S.week = 1;
    for (i = 0; i < S.men.length; i++) {
      m = S.men[i];
      m.yas += 1;
      m.sozlesme -= 1;
      if (m.yas >= 38) {
        m.st.cevik = Math.max(1, m.st.cevik - 1);
        m.st.sert = Math.max(1, m.st.sert - 1);
      }
      if (m.yas >= 50 && rngFrom(hash(S.seed, S.season, m.id))() > 0.7) {
        m.hp = 0;
        bury(m, "Yaş. Emek veya ölüm. Deftere düştü.");
      }
    }
    S.men = S.men.filter(function (x) { return x.hp > 0; });
    S.men.forEach(function(m){if(m.bag && !manById(m.bag.id))m.bag=null;});
    S.prep.squad=S.prep.squad.filter(function(id){return !!manById(id);});
    if (S.pts >= 28 && S.tier < 5) {
      S.tier += 1;
      haber("Küme", "Üst kademe: " + TIERS[S.tier] + ".");
      kronik("Sezon bitti. Çete " + TIERS[S.tier] + " kademesine çıktı.");
    } else if (S.pts < 10 && S.tier > 0) {
      S.tier -= 1;
      haber("Düşme", "Kademe düştü: " + TIERS[S.tier] + ".");
    }
    if (S.tier === 5) {
      haber("Taht", "Taht Savaşı. Şehri tutan isim deftere geçer.");
      kronik("Taht. " + S.name + " şehri tutmaya çalıştı.");
    }
    S.gangs.forEach(function(g){g.pts=0;});
    if(wasThrone && S.tier===5 && S.pts>=28 && !S.crowned){S.crowned=true;kronik("Şehir tahtı bir sezon korundu. Hanedan hedefi tamamlandı.");if(S.mode!=="hanedan"){S.over=true;S.overWhy="Tahtı bir sezon korudun. Hanedan deftere geçti.";}}
    if(!S.men.length){S.over=true;S.overWhy="Kadroda kimse kalmadı.";}
    S.pts = 0;
    for (i = 0; i < S.men.length; i++) {
      if (S.men[i].sozlesme <= 0) {
        haber("Sözleşme", S.men[i].ad + " sözleşmesi bitti. Karşıla, pazarlık et veya bırak.");
      }
    }
  }

  function doAdvance() {
    if (!S || S.over || inFlight || reader) return;
    if (view !== "play") return;
    var now = Date.now();
    if (now - lastAct < 400) return;
    lastAct = now;
    inFlight = true;
    try {
      if (!currentSquadMen().length) { toast("Hazır ve sözleşmeli bir ekip seç. Gerekirse dinlen veya pazardan adam al."); return; }
      var kitCost = {yok:0,fener:1,sargi:2,zarf:3,arac:4}[S.prep.kit] || 0;
      if(S.malzeme < kitCost){toast("Seçilen donanım için malzeme yetmiyor.");return;}
      S.malzeme -= kitCost;
      var raid = simRaid();
      reader = { raid: raid, idx: 0, done: false, retreated: false };
      tab = "baskin";
      S.pend = { raid: raid, idx: 0, done: false, retreated: false };
      saveNow();
      paint();
    } finally {
      inFlight = false;
    }
  }

  function readerIlerle() {
    if (!reader) return;
    var room = reader.raid.rooms[reader.idx];
    if (room && room.silent && !S.prep.silent) {
      openSilent();
      return;
    }
    if (reader.idx < reader.raid.rooms.length - 1) {
      reader.idx += 1;
      if (S) S.pend = { raid: reader.raid, idx: reader.idx, done: false, retreated: false };
      scheduleSave();
      paint();
      return;
    }
    finishRaid(false);
  }
  function readerGeri() {
    if (!reader) return;
    finishRaid(true);
  }
  function finishRaid(retreated) {
    if (!reader || reader.done) return;
    reader.done = true;
    var reached = reader.raid.rooms.slice(0, reader.idx + 1);
    if(reader.raid.crewIds){
      reached.forEach(function(room){(room.crew || []).forEach(function(snapshot){var m=manById(snapshot.id);if(m) Object.assign(m,snapshot);});});
      reader.raid.rooms = reached;
      if(retreated) reader.raid.loot = Math.max(0,(reached.length ? reached[reached.length-1].loot : 0)+(reader.raid.choiceLootDelta || 0));
    }
    applyRaid(reader.raid, retreated);
    simLeague();
    if (!retreated && S.week === 16) {
      kronik("Kupa haftası bitti.");
    }
    S.week += 1;
    if (S.week > 16) endSeason();
    if (!S.over) tickWeekEnd();
    var raid = reader.raid;
    reader = null;
    if (S) S.pend = null;
    saveNow();
    openDebrief(raid, retreated);
  }

    if (raid.syn.length) add(sh, el("p", { cls: "small", text: "Sinerji: " + raid.syn.join(", ") }));

    openSheet();
  }

  function scoutNow() {
    if (S.prep.scout) {
      toast("Keşif yapıldı.");
      return;
    }
    if (S.malzeme < 4) {
      toast("Malzeme yetmez.");
      return;
    }
    S.malzeme -= 4;
    var snap = [];
    var i, m;
    for (i = 0; i < S.men.length; i++) {
      m = S.men[i];
      snap.push({ id: m.id, hp: m.hp, yorgun: m.yorgun, yara: m.yara.slice(), carry: m.carry });
    }
    var raid = simRaid();
    for (i = 0; i < snap.length; i++) {
      m = manById(snap[i].id);
      if (!m) continue;
      m.hp = snap[i].hp;
      m.yorgun = snap[i].yorgun;
      m.yara = snap[i].yara;
      m.carry = snap[i].carry;
    }
    S.prep.scout = {
      rooms: raid.rooms.length,
      cond: raid.cond,
      opp: raid.opp,
      derby: raid.derby,
      weak: raid.rooms[0].nums.danger
    };
    scheduleSave();
    paint();
  }

  function hireMan(id) {
    var c = null;
    for (var i = 0; i < S.market.length; i++) if (S.market[i].id === id) c = S.market[i];
    if (!c) return;
    if(S.men.length>=24){toast("Kadro dolu: 24 adam.");return;}
    if (S.kasa < c.yevmiye * 4) {
      toast("Kasa yetmez.");
      return;
    }
    S.kasa -= c.yevmiye * 4;
    S.men.push(c);
    S.market = S.market.filter(function (x) { return x.id !== id; });
    kronik(c.ad + " kadroya alındı. Yevmiye " + fmtTL(c.yevmiye) + ".");
    scheduleSave();
    paint();
  }
  function fireMan(id) {
    var m = manById(id);
    if (!m) return;
    S.men = S.men.filter(function (x) { return x.id !== id; });
    kronik(m.ad + " bırakıldı. Sözleşme kapandı.");
    scheduleSave();
    closeSheet();
  }
  function bailMan(id) {
    var m = manById(id);
    if (!m || m.jail <= 0) return;
    var cost = 40000 + S.heat * 200;
    if (S.kasa < cost) {
      toast("Kefalet yok.");
      return;
    }
    S.kasa -= cost;
    m.jail = 0;
    kronik(m.ad + " çıktı. Kefalet " + fmtTL(cost) + ".");
    scheduleSave();
    paint();
  }
  function upgradeBld(key) {
    if(!BLD.some(function(b){return b[0]===key;}))return;
    var lv = S.bld[key] || 0;
    if(lv>=5){toast("Tesis en yüksek düzeyde.");return;}
    var cost = 50000 * (lv + 1);
    if (S.kasa < cost) {
      toast("Kasa yetmez.");
      return;
    }
    S.kasa -= cost;
    S.bld[key] = lv + 1;
    scheduleSave();
    paint();
  }
  function hireStaff(key) {
    if (S.staff[key]) {
      S.staff[key] = 0;
    } else {
      if (S.kasa < 30000) {
        toast("Kasa yetmez.");
        return;
      }
      S.kasa -= 30000;
      S.staff[key] = 1;
    }
    scheduleSave();
    paint();
  }

  function exportSave() {
    if (!S) {
      var disk = loadSave();
      if (disk && disk !== "corrupt") S = disk;
    }
    if (!S) {
      toast("Kayıt yok.");
      return;
    }
    saveNow();
    var raw = encodeSave(S);
    var slug = String(S.name || "hanedan").replace(/[^\wçğıöşüÇĞİÖŞÜ\- ]+/g, "").replace(/\s+/g, "-").slice(0, 24);
    var fname = "hanedan-" + (slug || "defter") + "-s" + S.season + "h" + S.week + ".hanedan";
    try {
      var blob = new Blob([raw], { type: "text/plain;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = el("a", { href: url, download: fname });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 1500);
    } catch (e) {}
    copyText(raw);
  }
  function copyText(raw) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(raw).then(function () { toast("Kopyalandı."); }, function () { fallbackCopy(raw); });
    } else fallbackCopy(raw);
  }
  function fallbackCopy(raw) {
    var sh = document.getElementById("sheet");
    clear(sh);
    add(sh, el("p", { cls: "kicker", text: "Kopyala" }));
    var ta = add(sh, el("textarea"));
    ta.value = raw;
    ta.rows = 12;
    ta.readOnly = true;
    add(sh, el("button", { cls: "primary", text: "Kapat", "data-act": "close" }));
    openSheet();
    ta.focus();
    ta.select();
  }
  function importRaw(raw) {
    var data = parseSave(raw);
    if (!data || data === "corrupt") {
      openModal("Bozuk kayıt", "Yedek okunamadı. HANEDAN/2 veya eski JSON.", [["Tamam", "close"]]);
      return;
    }
    if (S && S.mode === "demir" && data.run !== S.run) {
      openModal("Red", "Demir'de başka run yüklenemez.", [["Tamam", "close"]]);
      return;
    }
    resumeSave(data);
    saveNow();
    closeSheet();
    toast("Kayıt yüklendi.");
  }

  function copySeason() {
    var lines = [];
    lines.push(S.name + " — Sezon " + S.season + " — " + yearNow());
    for (var i = 0; i < S.kronik.length; i++) {
      if (S.kronik[i].y === yearNow() || S.kronik[i].t.indexOf("Sezon " + S.season) !== -1) {
        lines.push(S.kronik[i].s);
      }
    }
    copyText(lines.join("\n"));
  }

  function act(code, node) {
    if (!code) return;
    var reason=blockedAction(code);if(reason){toast(reason);return;}
    var p = code.split(":");
    var k = p[0];
    var a = p.slice(1).join(":");
    var readOnly = ["save","close","title","menu","tab","man","haber","export","import","doimport","copy","font","wipe","wipe2","load","resume","new","demir","home","mode","setupgo","drafttog","draftsee","draftok","draftforce","help","slot"];
    if(S && S.over && readOnly.indexOf(k)<0){toast("Defter kapandı. Yeni hanedan kurabilir veya kaydı inceleyebilirsin.");return;}
    if(reader && ["rnext","rback","silent"].indexOf(k)<0 && readOnly.indexOf(k)<0){toast("Önce açık baskını tamamla.");return;}
    if(k==="save"){toast(saveNow()?"Kayıt güncel.":"Kayıt yazılamadı; yedek al.");return;}
    if(k==="rest"){if(reader||!S||S.over)return; S.week++;if(S.week>16)endSeason();if(!S.over)tickWeekEnd();kronik("Bu hafta baskın yapılmadı. Ekip dinlendi; fikstür puanı alınmadı.");saveNow();paint();return;}

    if (k === "close") { closeSheet(); return; }
    if (k === "help") { openHelp(); return; }
    if (k === "title") { bootTitle(); return; }
    if (k === "slot") {
      if (S) saveNow();
      bindHanedanSlot(+a);
      S = null;
      reader = null;
      view = "title";
      paint();
      return;
    }
    if (k === "new") { startNew(a || "klasik"); return; }
    if (k === "demir") { startNew("demir"); return; }
    if (k === "setupgo") {
      var inp = document.getElementById("cname");
      if (inp) tmpName = inp.value;
      beginDraft();
      return;
    }
    if (k === "home") {
      var cHome = document.getElementById("cname");
      if (cHome) tmpName = cHome.value;
      var parts = a.split(",");
      tmpHome = { r: +parts[0], d: +parts[1] };
      paint();
      return;
    }
    if (k === "mode") {
      var cMode = document.getElementById("cname");
      if (cMode) tmpName = cMode.value;
      tmpMode = a;
      paint();
      return;
    }
    if (k === "drafttog") {
      var ix = draftPick.indexOf(a);
      var locked = false;
      for (var di = 0; di < draftPool.length; di++) if (draftPool[di].id === a && draftPool[di].locked) locked = true;
      if (locked) return;
      if (ix >= 0) draftPick.splice(ix, 1);
      else if (draftPick.length < 8) draftPick.push(a);
      if (sheetOpen) closeSheet(false);
      paint();
      return;
    }
    if (k === "draftsee") {
      openDraft(a);
      return;
    }
    if (k === "draftok") { commitDraft(); return; }
    if (k === "draftforce") { tmpWipeOk = true; commitDraft(); return; }
    if (k === "load" || k === "resume") { offerLoad(); return; }
    if (k === "menu") { bootTitle(); return; }
    if (k === "tab") {
      tab = a;
      if (S) { S.tab = a; scheduleSave(); }
      paint();
      return;
    }
    if (k === "ilerlet") { doAdvance(); return; }
    if (k === "scout") { scoutNow(); return; }
    if (k === "gambit") { S.prep.gambit = a; scheduleSave(); paint(); return; }
    if (k === "kit") { S.prep.kit = a; scheduleSave(); paint(); return; }
    if (k === "squadtog") {
      var si = S.prep.squad.indexOf(a);
      if (si >= 0) S.prep.squad.splice(si, 1);
      else if (S.prep.squad.length < squadSize()) S.prep.squad.push(a);
      scheduleSave();
      paint();
      return;
    }
    if (k === "koru") { S.prep.koru = a; scheduleSave(); paint(); return; }
    if (k === "man") { openMan(a); return; }
    if (k === "hire") { hireMan(a); return; }
    if (k === "fire") { fireMan(a); return; }
    if (k === "bail") { bailMan(a); return; }
    if (k === "up") { upgradeBld(a); return; }
    if (k === "staff") { hireStaff(a); return; }
    if (k === "rnext") { readerIlerle(); return; }
    if (k === "rback") { readerGeri(); return; }
    if (k === "silent") {
      if(!reader || S.prep.silent || !reader.raid.rooms[reader.idx].silent)return;
      var changes={borclu:[6000,2],ihbarci:[-3000,-3],telsiz:[0,-2],kasa:[9000,5],soyleme:[0,1]}[a];
      if(!changes)return;S.prep.silent=a;reader.raid.choiceLootDelta=(reader.raid.choiceLootDelta || 0)+changes[0];reader.raid.loot=Math.max(0,reader.raid.loot+changes[0]);reader.raid.heat=clamp(reader.raid.heat+changes[1],1,20);
      var label = a;
      for (var s = 0; s < SILENT.length; s++) if (SILENT[s][0] === a) label = SILENT[s][1];
      kronik("Sessiz oda: " + label + ".");
      scheduleSave();
      closeSheet();
      paint();
      return;
    }
    if (k === "haber") { openHaber(+a); return; }
    if (k === "font") {
      S.font = +a;
      document.documentElement.style.fontSize = S.font + "px";
      scheduleSave();
      paint();
      return;
    }
    if (k === "export") { exportSave(); return; }
    if (k === "import") { openImport(); return; }
    if (k === "doimport") {
      var ta = document.getElementById("imp");
      if (ta) importRaw(ta.value);
      return;
    }
    if (k === "copy") { copySeason(); return; }
    if (k === "wipe") {
      openModal("Defteri kapat", "Kayıt bu cihazdan silinir. Yedek aldın mı?", [["Sil", "wipe2"], ["Vazgeç", "close"]]);
      return;
    }
    if (k === "wipe2") {
      wipeAllSaves();
      S = null;
      reader = null;
      closeSheet(false);
      view = "title";
      paint();
      return;
    }
    if (k === "kid") {
      if (a === "al" && S.kid) {
        var boy = genMan(rngFrom(hash(S.seed, S.season, S.week, "kid")), yearNow(), S.home, false);
        boy.ad = S.kid.ad;
        boy.yas = 16;
        boy.rol = "Gözcü";
        if (!alive().length) boy.traits.push("ugurlu");
        else {
          var ment = alive()[0];
          boy.bag = { tur: "dost", id: ment.id };
        }
        if(S.men.length >= 24){toast("Kadro dolu: 24 adam.");return;}
        S.men.push(boy);
        kronik("Kapıdaki çocuk alındı: " + boy.ad + ".");
        S.kid.resolved = true;
        S.kid = null;
      } else if (S.kid) {
        kronik("Kapıdaki çocuk reddedildi.");
        S.kid.resolved = true;
        S.kid = null;
      }
      scheduleSave();
      closeSheet();
      paint();
      return;
    }
    if (k === "cmp") {
      var ci = compareIds.indexOf(a);
      if (ci >= 0) compareIds.splice(ci, 1);
      else {
        if (compareIds.length >= 2) compareIds.shift();
        compareIds.push(a);
      }
      paint();
      return;
    }
    if (k === "soz") {
      var mm = manById(p[2] || "");
      if (!mm) return;
      if (p[1] === "pay") {
        if (S.kasa < mm.yevmiye * 6) { toast("Kasa yetmez."); return; }
        S.kasa -= mm.yevmiye * 6;
        mm.sozlesme = 3;
        kronik(mm.ad + " karşılandı. Üç sezon daha.");
      } else if (p[1] === "leave") {
        fireMan(mm.id);
        return;
      }
      scheduleSave();
      closeSheet();
      return;
    }
    if (node && node.tagName === "INPUT") return;
  }

  function offerLoad() {
    if (S && S.run && view !== "title") {
      view = "play";
      reader = S.pend || reader;
      paint();
      return;
    }
    if (S && S.run && view === "title") {

      return;

    clear(tabs);

      add(main, el("p", { cls: "serif", text: "Adamlar ölür. Hanedan kalır. Şehir ikisini de hatırlar." }));

      [1, 2, 3].forEach(function (n) {
        var raw = lsGet("tariklab::hanedan:" + n);
        var parsed = raw ? parseSave(raw) : null;

        if (parsed && parsed !== "corrupt") label += " · " + (parsed.name || "kayıt");

        else label += " · boş";
        add(slots, el("button", { cls: SLOT === n ? "primary" : "", text: label, "data-act": "slot:" + n }));
      });
      var disk = (S && S.run) ? S : loadSave();
      var st = add(main, el("div", { cls: "stack" }));
      if (disk === "corrupt") {
        add(st, el("p", { cls: "warn", text: "Kayıt bozuk. Yedek yükle veya yeni başla." }));
        add(st, el("button", { cls: "primary", text: "Yedek yükle", "data-act": "import" }));
        add(st, el("button", { text: "Yeni hanedan", "data-act": "new:klasik" }));
      } else if (disk) {
        add(st, el("p", { cls: "ok", text: saveLabel(disk) }));
        if (disk.savedAt) {
          add(st, el("p", { cls: "small", text: "Son kayıt " + new Date(disk.savedAt).toLocaleString("tr-TR") }));
        }
        add(st, el("button", { cls: "primary", text: disk.over ? "Defteri aç" : "Devam", "data-act": "resume" }));
        add(st, el("button", { text: "Yeni hanedan", "data-act": "new:klasik" }));
        add(st, el("button", { text: "Demir", "data-act": "demir" }));
        add(st, el("button", { text: "Yedek yükle", "data-act": "import" }));
      } else {
        add(st, el("button", { cls: "primary", text: "Yeni hanedan", "data-act": "new:klasik" }));
        add(st, el("button", { text: "Demir", "data-act": "demir" }));
        add(st, el("button", { text: "Yedek yükle", "data-act": "import" }));
      }
      var credit = add(main, el("p", { cls: "small" }));
      credit.innerHTML = "© 2026 TarikLab. Tüm hakları saklıdır.<br>Oyun tasarımı ve özgün içerik: Tarık Halil Ayaz.";
      return;
    }
    if (view === "setup") {
      tabs.style.display = "none";
      add(header, el("button", { cls: "ghost", text: "←", "data-act": "title", "aria-label": "Geri" }));
      add(header, el("strong", { cls: "grow", text: "Kuruluş" }));
      if (tmpMode !== "demir") {
        add(main, el("p", { cls: "kicker", text: "Mod" }));
        var mg = add(main, el("div", { cls: "grid2" }));
        add(mg, el("button", { cls: tmpMode === "klasik" ? "primary" : "", text: "Klasik", "data-act": "mode:klasik" }));
        add(mg, el("button", { cls: tmpMode === "hanedan" ? "primary" : "", text: "Hanedan uzun", "data-act": "mode:hanedan" }));
        add(mg, el("button", { cls: tmpMode === "sokak" ? "primary" : "", text: "Sokak doğanları", "data-act": "mode:sokak" }));
      } else {
        add(main, el("p", { cls: "warn", text: "Demir: tek slot. Eski yedeğe dönüş kısıtlı. Hafta onaylıdır." }));
      }
      add(main, el("p", { cls: "kicker", text: "Çete adı" }));
      var inp = add(main, el("input", { id: "cname", maxlength: "28", "aria-label": "Çete adı" }));
      inp.value = tmpName;
      add(main, el("p", { cls: "kicker", text: "Ev semti" }));
      for (var r = 0; r < REGIONS.length; r++) {
        var card = add(main, el("div", { cls: "card" }));
        add(card, el("div", { text: REGIONS[r].name }));
        for (var d = 0; d < REGIONS[r].d.length; d++) {
          var b = add(card, el("button", {
            text: REGIONS[r].d[d],
            "data-act": "home:" + r + "," + d,
            cls: (tmpHome.r === r && tmpHome.d === d) ? "gold" : "ghost"
          }));
          b.style.margin = "4px 4px 0 0";
        }
      }
      add(main, el("button", { cls: "primary", text: "Adaylara geç", "data-act": "setupgo" }));
      return;
    }
    if (view === "draft") {
      tabs.style.display = "none";
      add(header, el("strong", { cls: "grow", text: "Draft " + draftPick.length + "/8" }));
      add(header, el("button", { cls: "primary", text: "Kur", "data-act": "draftok" }));
      add(main, el("p", { cls: "small", text: "16 aday. 8 seç. Adayın ayrıntısı için satıra bas." }));
      for (var i = 0; i < draftPool.length; i++) {
        var m = draftPool[i];
        var on = draftPick.indexOf(m.id) !== -1;
        var row = add(main, el("div", { cls: "man", "data-act": "draftsee:" + m.id }));
        add(row, portrait(hash(m.id), 28));
        var c = add(row, el("div", { cls: "grow" }));
        add(c, el("div", { text: (on ? "● " : "○ ") + m.ad + (m.locked ? " (kan)" : "") }));
        add(c, el("div", { cls: "small", text: m.rol + " · " + m.yas + " · " + TRAIT_NAME[m.traits[0]] + " / " + TRAIT_NAME[m.traits[1]] }));
      }
      return;
    }

    tabs.style.display = "flex";
    if (S && S.font) document.documentElement.style.fontSize = S.font + "px";
    add(header, el("button", { cls: "ghost", text: "Ana Menü", "data-act": "title" }));
    add(header, el("strong", { cls: "grow", text: S.name }));
    add(header, el("button", {text:"?", "aria-label":"Nasıl oynanır", "data-act":"help"}));
    add(header, el("button", {text:"Kaydet", "data-act":"save"}));
    var meta = add(header, el("span", { cls: "mono small", text: fmtHafta() }));
    meta.setAttribute("aria-label", fmtHafta());
    var go = add(header, el("button", { cls: "primary", text: reader ? "Baskın sürüyor" : S.over ? "Defter kapandı" : "Baskına çık", "data-act": "ilerlet" }));
    if (S.over || reader) go.disabled = true;
    for (var t = 0; t < TABS.length; t++) {
      var tb = add(tabs, el("button", { text: TABS[t][1], "data-act": "tab:" + TABS[t][0] }));
      if (tab === TABS[t][0]) {tb.className = "gold";tb.setAttribute("aria-current","page");}
    }
    if (S.over) {
      add(main, el("div", { cls: "card" }));
      main.firstChild.appendChild(el("p", { cls: "kicker", text: "Defter kapandı" }));
      main.firstChild.appendChild(el("p", { cls: "serif", text: S.overWhy }));
      add(main, el("button", { text: "Yedek al", "data-act": "export" }));
      add(main, el("button", { text: "Baştan", "data-act": "wipe2" }));
    }
    if (tab === "sehir") paintSehir(main);
    else if (tab === "kahve") paintKahve(main);
    else if (tab === "baskin") paintBaskin(main);
    else if (tab === "pazar") paintPazar(main);
    else if (tab === "tesis") paintTesis(main);
    else if (tab === "haber") paintHaber(main);
    else paintDefter(main);
    if (S.kid && S.kid.ready && !sheetOpen) {
      /* door prompt once per paint is noisy; show card in defter/kahve */
    }
  }

  function paintSehir(main) {
    add(main, el("p", {cls:"sub",text:TIERS[S.tier]+" · Sezon puanı "+S.pts+"/28 · 16 hafta sonunda 28 puan terfi, 10 altı düşüş. Tahtı bir sezon koru."}));
    add(main, el("p", { cls: "kicker", text: districtName(S.home) }));
    var svg = svgEl("svg", { viewBox: "0 0 220 140", width: "100%", height: "140", "aria-label": "İstanbul" });
    var cols = ["#2a2620", "#3a3228", "#2c4a6e", "#3a4030", "#4a3020", "#2a3a32", "#3a2a28"];
    for (var i = 0; i < 7; i++) {
      var x = (i % 4) * 54 + 4;
      var y = Math.floor(i / 4) * 64 + 4;
      var g = svgEl("g");
      var rec = svgEl("rect", { x: String(x), y: String(y), width: "50", height: "56", rx: "6", fill: cols[i], stroke: S.home.r === i ? "#c4a574" : "#2a2620" });
      g.appendChild(rec);
      var tx = svgEl("text", { x: String(x + 6), y: String(y + 32), fill: "#e8dcc8", "font-size": "7" });
      tx.textContent = REGIONS[i].name.split(" ")[0];
      g.appendChild(tx);
      svg.appendChild(g);
    }
    add(main, svg);
    var heat = add(main, el("div", { cls: "card" }));
    add(heat, el("p", { cls: "kicker", text: "Isı" }));
    bar(heat, "Savaş", Math.min(100, S.sohret * 4));
    bar(heat, "Polis", S.heat);
    bar(heat, "Siyaset", S.siyasi * 8);
    add(main, el("p", { cls: "mono", text: "Kasa " + fmtTL(S.kasa) + " · Malzeme " + S.malzeme + " · Şöhret " + S.sohret }));
    var opp = currentOpp();
    var fx = add(main, el("div", { cls: "card" }));
    add(fx, el("p", { cls: "kicker", text: "Fikstür" }));
    add(fx, el("p", { text: opp.name + (opp.r === S.home.r && opp.d === S.home.d ? " · DERBİ" : "") }));
    add(fx, el("p", { cls: "small", text: TIERS[opp.tier] + " · güç " + opp.power }));
    for (var t = 5; t >= 0; t--) {
      var acc = add(main, el("div", { cls: "card" }));
      add(acc, el("p", { cls: "kicker", text: TIERS[t] + (S.tier === t ? " · biz" : "") }));
      var n = 0;
      for (i = 0; i < S.gangs.length && n < 6; i++) {
        if (S.gangs[i].tier === t) {
          add(acc, el("p", { cls: "small", text: S.gangs[i].name + " · " + S.gangs[i].pts + " p" }));
          n++;
        }
      }
      if (S.tier === t) add(acc, el("p", { cls: "ok", text: S.name + " · " + S.pts + " p" }));
    }
    if (window.tlabI18n && window.tlabI18n.getLang() === "en") window.tlabI18n.applyPhrases(document.body);
  }
  function bar(p, label, v) {
    var r = add(p, el("div", { cls: "row" }));
    add(r, el("span", { cls: "small grow", text: label }));
    add(r, el("span", { cls: "mono small", text: String(Math.round(v)) }));
    var m = add(p, el("div", { cls: "meter" }));
    var i = add(m, el("i"));
    i.style.width = clamp(v, 0, 100) + "%";
  }

  function paintKahve(main) {
    add(main, el("p", { cls: "kicker", text: "Kadro " + S.men.length }));
    if (S.kid && !S.kid.ready) {
      var wait = add(main, el("div", { cls: "card" }));
      add(wait, el("p", { text: "Kapıda biri. Gece " + S.kidNights + "/3." }));
    }
    if (S.kid && S.kid.ready && !S.kid.resolved) {
      var kd = add(main, el("div", { cls: "card" }));
      add(kd, el("p", { text: "Kapıda çocuk. Gece " + S.kidNights + "/3." }));
      add(kd, el("button", { text: "Al", "data-act": "kid:al" }));
      add(kd, el("button", { text: "Reddet", "data-act": "kid:hayir" }));
    }
    var list = S.men;
    var max = list.length > 60 ? 60 : list.length;
    for (var i = 0; i < max; i++) {
      var m = list[i];
      var row = add(main, el("div", { cls: "man", "data-act": "man:" + m.id }));
      add(row, portrait(hash(m.id), 28));
      var pip = add(row, el("span", { cls: "pip" }));
      pip.style.background = ROLE_COL[m.rol] || "#c4a574";
      var c = add(row, el("div", { cls: "grow" }));
      add(c, el("div", { text: m.ad + (m.lakap ? " “" + m.lakap + "”" : "") }));
      add(c, el("div", { cls: "small", text: m.rol + " · " + fmtTL(m.yevmiye) + " · " + m.sozlesme + " sezon sözleşme · yorgun " + m.yorgun + (m.bag ? " · bağ" : "") + (m.jail ? " · hapis" : "") }));
    }
  }

  function paintBaskin(main) {
    if (reader) {
      var room = reader.raid.rooms[reader.idx];
      add(main, el("p", { cls: "kicker", text: "Oda " + room.n + " / " + reader.raid.rooms.length }));
      var box = add(main, el("div", { cls: "card" }));
      for (var i = 0; i < room.lines.length; i++) {
        add(box, el("p", { cls: "serif", text: room.lines[i] }));
      }
      add(main, el("p", { cls: "mono small", text: "güç " + room.nums.power + " · tehlike " + room.nums.danger + " · fark " + room.nums.margin }));
      var row = add(main, el("div", { cls: "row" }));
      add(row, el("button", { text: "Geri çekil", "data-act": "rback" }));
      add(row, el("button", { cls: "primary grow", text: "İlerle", "data-act": "rnext" }));
      return;
    }
    var opp = currentOpp();
    add(main, el("p", { cls: "kicker", text: "Brifing" }));
    add(main, el("p", { cls: "serif", text: opp.name + (opp.r === S.home.r && opp.d === S.home.d ? " — derbi." : ".") + " Baskına çık veya puandan vazgeçip dinlen." }));
    if (S.week === 1) add(main, el("p", { cls: "warn", text: "İlk saat: derbi, ölüm masada, bir sözleşme bitmek üzere." }));
    add(main, el("button", { text: S.prep.scout ? "Keşif alındı" : "Keşif (−4 malzeme)", "data-act": "scout" }));
    if (S.prep.scout) {
      add(main, el("p", { cls: "small", text: S.prep.scout.rooms + " oda · " + S.prep.scout.cond + " · zayıf " + S.prep.scout.weak }));
    }
    add(main, el("p", { cls: "kicker", text: "Kadro " + S.prep.squad.length + "/" + squadSize() }));
    var a = alive();
    for (var i = 0; i < a.length; i++) {
      var on = S.prep.squad.indexOf(a[i].id) !== -1;
      var row = add(main, el("div", { cls: "man", "data-act": "squadtog:" + a[i].id }));
      add(row, portrait(hash(a[i].id), 28));
      add(row, el("div", { cls: "grow", text: (on ? "● " : "○ ") + a[i].ad + " · " + a[i].rol }));
    }
    add(main, el("p", { cls: "kicker", text: "Yaklaşım" }));
    var gg = add(main, el("div", { cls: "grid2" }));
    for (i = 0; i < GAMBITS.length; i++) {
      add(gg, el("button", { cls: S.prep.gambit === GAMBITS[i][0] ? "gold" : "", text: GAMBITS[i][1], "data-act": "gambit:" + GAMBITS[i][0] }));
    }
    if (S.prep.gambit === "koru") {
      a=currentSquadMen();
      add(main, el("p", { cls: "small", text: "Koru kimi?" }));
      for (i = 0; i < a.length; i++) {
        add(main, el("button", { cls: S.prep.koru === a[i].id ? "gold" : "ghost", text: a[i].ad, "data-act": "koru:" + a[i].id }));
      }
    }
    add(main, el("p", { cls: "kicker", text: "Donanım · baskın başına 0 / 1 / 2 / 3 / 4 malzeme" }));
    var kg = add(main, el("div", { cls: "grid2" }));
    for (i = 0; i < KITS.length; i++) {
      add(kg, el("button", { cls: S.prep.kit === KITS[i][0] ? "gold" : "", text: KITS[i][1], "data-act": "kit:" + KITS[i][0] }));
    }
    add(main, el("button", {text:"Bu hafta dinlen · puan yok", "data-act":"rest"}));
    add(main, el("p", { cls: "kicker", text: "Arşiv" }));
    for (i = 0; i < Math.min(6, S.archive.length); i++) {
      add(main, el("p", { cls: "small", text: S.archive[i].opp + " · " + S.archive[i].result }));
    }
  }

  function paintPazar(main) {
    add(main, el("p", { cls: "kicker", text: "Adaylar" }));
    add(main, el("p", { cls: "small", text: "Kıyas için iki aday işaretle." }));

      var ca = null, cb = null;

      }

        [ca, cb].forEach(function (m) {
          var c = add(cmp, el("div", { cls: "card" }));
          add(c, el("p", { text: m.ad }));
          add(c, el("p", { cls: "small", text: m.rol + " · " + m.yas }));

      }

      var br = add(row, el("div", { cls: "row" }));
      add(br, el("button", { text: "Kıyas", "data-act": "cmp:" + m.id }));
      add(br, el("button", { cls: "primary", text: "Al", "data-act": "hire:" + m.id }));

    add(main, el("p", { cls: "kicker", text: "Hapis" }));

  function paintDefter(main) {
    add(main, el("p", { cls: "kicker", text: "Kronik" }));
    var k = add(main, el("div", { cls: "card serif kronik" }));
    if (!S.kronik.length) k.textContent = "Defter boş.";
    else {
      var bits = [];
      for (var i = 0; i < S.kronik.length; i++) bits.push(S.kronik[i].t + " — " + S.kronik[i].s);
      k.textContent = bits.join("\n\n");
    }
    add(main, el("p", { cls: "kicker", text: "Mezarlık" }));
    if (!S.grave.length) add(main, el("p", { cls: "small", text: "Henüz kitabe yok." }));
    for (i = 0; i < S.grave.length; i++) {
      add(main, el("p", { cls: "serif", text: S.grave[i].ad + " · " + S.grave[i].kitabe }));
    }
    add(main, el("p", { cls: "kicker", text: "Ayarlar" }));
    if (S.savedAt) {
      add(main, el("p", { cls: "small", text: "Son kayıt " + new Date(S.savedAt).toLocaleString("tr-TR") }));
    }
    if (memStore) add(main, el("p", { cls: "warn", text: "Kayıt yalnızca bu oturumda. Yedek al." }));
    var fs = add(main, el("div", { cls: "row" }));
    add(fs, el("button", { text: "14", "data-act": "font:14" }));
    add(fs, el("button", { text: "16", "data-act": "font:16" }));
    add(fs, el("button", { text: "18", "data-act": "font:18" }));
    var st = add(main, el("div", { cls: "stack" }));
    add(st, el("button", { text: "Sezon kartını kopyala", "data-act": "copy" }));
    add(st, el("button", { cls: "gold", text: "Yedek al", "data-act": "export" }));
    add(st, el("button", { text: "Yedek yükle", "data-act": "import" }));
    add(st, el("button", { text: "Ana menü", "data-act": "menu" }));
    add(st, el("button", { text: "Defteri kapat", "data-act": "wipe" }));
    add(main, el("p", { cls: "small", text: "Mod: " + S.mode + " · run " + S.run + " · HANEDAN/2" }));
    add(main, el("p", { cls: "kicker", text: "Compendium" }));
    for (i = 0; i < TRAITS.length; i++) add(main, el("p", { cls: "small", text: TRAIT_NAME[TRAITS[i][0]] }));
  }

  var _paintHanedan = paint;
  paint = function () {
    _paintHanedan();
    if (window.tlabI18n && window.tlabI18n.getLang() === "en") window.tlabI18n.applyPhrases(document.body);
  };

  (function boot() {
    var data = loadSave();
    if (data === "corrupt") {
      view = "title";
      paint();
      openModal("Bozuk kayıt", "Kayıt okunamadı. Yedek yükle veya yeni oyun.", [["Yedek yükle", "import"], ["Tamam", "close"]]);
      return;
    }
    if (data) {
      resumeSave(data);
      return;
    }
    paint();
  })();
})();
</script>
</body>
</html>
