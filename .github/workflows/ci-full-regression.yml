name: ci-full-regression
"on":
  schedule:
    - cron: 43 2 * * *
  workflow_dispatch: null
concurrency:
  group: ci-full-regression
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.route.outputs.docs }}
      tc: ${{ steps.route.outputs.tc }}
      full: ${{ steps.route.outputs.full }}
      browser: ${{ steps.route.outputs.browser }}
      routes: ${{ steps.route.outputs.routes }}
      devlet: ${{ steps.route.outputs.devlet }}
      duel: ${{ steps.route.outputs.duel }}
      campaign: ${{ steps.route.outputs.campaign }}
      balance: ${{ steps.route.outputs.balance }}
    steps:
      - uses: actions/checkout@v4
      - id: route
        run: |-
          for flag in full browser tc devlet duel campaign balance; do echo "$flag=true" >> "$GITHUB_OUTPUT"; done
          echo "docs=false" >> "$GITHUB_OUTPUT"
          echo "routes=" >> "$GITHUB_OUTPUT"
  build-core:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs != 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.docs != 'true'
      - run: npm test
        if: needs.changes.outputs.docs != 'true'
      - name: Duel deterministic stress (500 per theme)
        if: needs.changes.outputs.duel == 'true'
        timeout-minutes: 5
        run: node scripts/duel-stress.mjs 500
      - run: npm run typecheck
        if: needs.changes.outputs.docs != 'true'
      - run: npm run lint
        if: needs.changes.outputs.docs != 'true'
      - run: npm run build
        if: needs.changes.outputs.docs != 'true'
  browser-regression:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.browser == 'true' || github.ref == 'refs/heads/main'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.browser == 'true' || github.ref == 'refs/heads/main'
      - run: npm run build
        if: needs.changes.outputs.browser == 'true' || github.ref == 'refs/heads/main'
      - name: Install Chromium for responsive regression
        if: needs.changes.outputs.browser == 'true' || github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Wave 1 save repairs in source and built games (TR/EN/PL, 390/1280)
        if: (matrix.suite == 'wave1-save') && (needs.changes.outputs.full == 'true')
        timeout-minutes: 5
        run: |
          node scripts/wave1-save-browser.mjs --serve public --label source
          node scripts/wave1-save-browser.mjs --serve .output/public --label built
      - name: Upload Wave 1 save repair evidence
        if: (matrix.suite == 'wave1-save') && (always())
        uses: actions/upload-artifact@v4
        with:
          name: wave1-save-repair-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots/wave1-save
      - name: Wave 1 decisions, state traces and paired evidence
        if: (matrix.suite == 'wave1-outcome') && (needs.changes.outputs.campaign == 'true' || needs.changes.outputs.full == 'true')
        timeout-minutes: 8
        run: |
          git fetch --no-tags --depth=1 origin 53534e2f9526ad80ce296952c212fa44aaa0ada1
          mkdir -p "$RUNNER_TEMP/wave1-before"
          git archive 53534e2f9526ad80ce296952c212fa44aaa0ada1 public | tar -x -C "$RUNNER_TEMP/wave1-before"
          node scripts/wave1-outcome-browser.mjs --serve "$RUNNER_TEMP/wave1-before/public" --baseline --label before
          node scripts/wave1-outcome-browser.mjs --serve public --label source
          node scripts/wave1-outcome-browser.mjs --serve .output/public --label built
      - name: Cete outcome moments (1440/390/320, motion, save and focus)
        if: (matrix.suite == 'cete') && (needs.changes.outputs.full == 'true')
        timeout-minutes: 5
        run: |
          node --experimental-strip-types --import ./scripts/ts-alias.mjs scripts/cete-outcome-browser.mjs
          CETE_BUILD=1 CETE_LABEL=built node --experimental-strip-types --import ./scripts/ts-alias.mjs scripts/cete-outcome-browser.mjs
      - name: Duel archive, save and 2.5D responsive regression
        if: (matrix.suite == 'duel') && (needs.changes.outputs.duel == 'true')
        timeout-minutes: 5
        run: node scripts/duel-browser.mjs
      - name: DEVLET map transition mobile regression
        if: (matrix.suite == 'devlet') && (needs.changes.outputs.devlet == 'true')
        timeout-minutes: 5
        run: node scripts/devlet-map-transition-browser.mjs
      - name: Upload duel evidence
        if: (matrix.suite == 'duel') && (always())
        uses: actions/upload-artifact@v4
        with:
          name: duel-responsive-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots/duel
      - name: Responsive and interaction regression (TR/EN, 16 live routes)
        if: (matrix.suite == 'responsive') && (needs.changes.outputs.browser == 'true')
        timeout-minutes: 10
        run: node scripts/sitewide-responsive.mjs
        env:
          SITEWIDE_ROUTE_IDS: ${{ needs.changes.outputs.routes }}
      - name: TC SIM historical starts (1440, 390, 320 px; save, reload and 2026)
        if: (matrix.suite == 'tc') && (needs.changes.outputs.tc == 'true')
        timeout-minutes: 10
        run: node scripts/tc-sim-historical-browser.mjs
      - name: Cete outcome production smoke (both hosts)
        if: (matrix.suite == 'production') && (github.ref == 'refs/heads/main')
        timeout-minutes: 5
        env:
          BROWSER_ALLOW_EXTERNAL_HOST: "1"
        run: |
          CETE_BASE=https://www.tariklab.com CETE_LABEL=www node --experimental-strip-types --import ./scripts/ts-alias.mjs scripts/cete-outcome-browser.mjs
          CETE_BASE=https://tariklab.tayaz29.workers.dev CETE_LABEL=workers node --experimental-strip-types --import ./scripts/ts-alias.mjs scripts/cete-outcome-browser.mjs
      - name: Wave 1 production proof (both hosts)
        if: (matrix.suite == 'production') && (github.ref == 'refs/heads/main')
        timeout-minutes: 6
        env:
          BROWSER_ALLOW_EXTERNAL_HOST: "1"
        run: |
          WAVE1_BASE=https://www.tariklab.com node scripts/wave1-outcome-browser.mjs --label www
          WAVE1_BASE=https://tariklab.tayaz29.workers.dev node scripts/wave1-outcome-browser.mjs --label workers
      - name: Upload Wave 1 outcome evidence
        if: (matrix.suite == 'wave1-outcome' || matrix.suite == 'production') && (always())
        uses: actions/upload-artifact@v4
        with:
          name: wave1-outcome-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots/wave1-outcome
      - name: Upload Cete outcome evidence
        if: (matrix.suite == 'cete' || matrix.suite == 'production') && (always())
        uses: actions/upload-artifact@v4
        with:
          name: cete-outcome-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots/cete-outcome
      - name: Upload responsive evidence
        if: (matrix.suite == 'responsive') && (always())
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-responsive-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots/tariklab-ux
      - name: Upload TC SIM historical evidence
        if: (matrix.suite == 'tc') && (always())
        uses: actions/upload-artifact@v4
        with:
          name: tc-sim-historical-responsive-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots/tc-sim-historical
      - name: Verify deployed duel assets, archives and legacy saves
        if: (matrix.suite == 'production') && (github.ref == 'refs/heads/main')
        timeout-minutes: 8
        run: node scripts/duel-production.mjs
      - name: Upload production duel evidence
        if: (matrix.suite == 'production') && (always() && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: duel-production-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots/duel-production
    strategy:
      fail-fast: false
      matrix:
        suite:
          - wave1-save
          - wave1-outcome
          - cete
          - duel
          - devlet
          - responsive
          - tc
          - production
  build:
    if: ${{ always() }}
    needs:
      - changes
      - build-core
      - browser-regression
      - campaign-browser
      - campaign-balance
      - unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require every build dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-required-gate.mjs
  campaign-browser:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.campaign == 'true' || github.ref == 'refs/heads/main'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.campaign == 'true' || github.ref == 'refs/heads/main'
      - name: Install Chromium
        if: needs.changes.outputs.campaign == 'true' || github.ref == 'refs/heads/main'
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: HANEDANIAN desktop, touch and real offline reload
        if: needs.changes.outputs.campaign == 'true'
        run: node scripts/hanedanian-browser.mjs
        env:
          HANEDANIAN_SOAK_MS: "0"
      - name: IHTILAL first minute and five minute decision loop
        if: needs.changes.outputs.campaign == 'true' && !cancelled()
        run: node scripts/ihtilal-browser.mjs
      - name: Verify exact production game code and both games in Chromium
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 12
        run: node scripts/campaign-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-browser
          path: |
            ${{ runner.temp }}/screenshots/hanedanian
            ${{ runner.temp }}/screenshots/ihtilal
  campaign-balance:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Twenty deterministic seeds across all three victory routes
        if: needs.changes.outputs.balance == 'true'
        run: node scripts/hanedanian-campaign-probe.mjs
        env:
          PROBE_OUTPUT: campaign-balance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-balance
          path: campaign-balance*.json
  unit:
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - run: echo "All unit tests, including exhaustive populations, ran in build-core via npm test"
