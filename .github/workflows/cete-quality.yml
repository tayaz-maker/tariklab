name: cete-quality
on:
  pull_request:
    paths:
      - src/game/**
      - src/components/game/**
      - scripts/cete-quality-browser.mjs
      - .github/workflows/cete-quality.yml
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --import ./scripts/ts-alias.mjs --test src/game/*.test.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - run: node --experimental-strip-types --import ./scripts/ts-alias.mjs scripts/cete-quality-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cete-quality
          path: ${{ runner.temp }}/screenshots/cete-quality
