name: Boardworld quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: boardworld-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  boardworld:
    runs-on: ubuntu-24.04
    # Gold Preparation adds 18 annual replays and one 730-day replay.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable released6 compatibility reference
        # checkout is shallow; browser rollback tests archive this exact shipped tree.
        run: git fetch --no-tags --depth=1 origin d695119186cad42c079a911a60c372f201b3b64b
      - uses: ./.github/actions/ci-node
      - name: Deterministic simulation and save recovery
        env:
          BOARDWORLD_ACCEPTANCE_REPORT: ${{ runner.temp }}/boardworld-acceptance.json
          BOARDWORLD_GOLD_REPORT: ${{ runner.temp }}/boardworld-gold-endurance.json
        run: node --test scripts/boardworld*.test.mjs
      - name: Production bundle
        run: npm run build
      - name: Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Real play, reload, recovery and responsive production assets
        run: node scripts/boardworld-browser.mjs --serve .output/public
      - name: Deep Life decisions, automation, migration and responsive panels
        run: node scripts/boardworld-deep-browser.mjs --serve .output/public
      - name: Living City calendar, routes, projects, intents and v2 migration
        run: node scripts/boardworld-living-browser.mjs --serve .output/public
      - name: Emergent Life causal decisions, shared household, policies and v3 isolation
        run: node scripts/boardworld-emergent-browser.mjs --serve .output/public
      - name: Living Society invitations, daily decisions, locales and v4 isolation
        run: node scripts/boardworld-society-browser.mjs --serve .output/public
      - name: Gold native cross-tab transaction and import races
        run: |
          node scripts/boardworld-stale-browser.mjs --serve .output/public
          node scripts/boardworld-concurrent-browser.mjs --serve .output/public --output "$RUNNER_TEMP/screenshots/boardworld-stale/concurrent.json"
          node scripts/boardworld-concurrent-browser.mjs --serve .output/public --stale-cache --repeats 20 --output "$RUNNER_TEMP/screenshots/boardworld-stale/frozen-cache.json"
          node scripts/boardworld-transaction-browser.mjs --serve .output/public --output "$RUNNER_TEMP/screenshots/boardworld-stale/transactions.json"
      - name: Released6 stale tab cannot replace a newer Gold save
        run: node scripts/boardworld-legacy-tab-browser.mjs --serve .output/public
      - name: Every legacy backup and original remains recoverable
        run: node scripts/boardworld-legacy-slot-browser.mjs --serve .output/public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardworld-browser
          path: |
            ${{ runner.temp }}/boardworld-acceptance.json
            ${{ runner.temp }}/boardworld-gold-endurance.json
            ${{ runner.temp }}/screenshots/boardworld
            ${{ runner.temp }}/screenshots/boardworld-deep
            ${{ runner.temp }}/screenshots/boardworld-living
            ${{ runner.temp }}/screenshots/boardworld-emergent
            ${{ runner.temp }}/screenshots/boardworld-society
            ${{ runner.temp }}/screenshots/boardworld-stale
            ${{ runner.temp }}/screenshots/boardworld-legacy-tab
            ${{ runner.temp }}/screenshots/boardworld-legacy-slot
