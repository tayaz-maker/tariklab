name: tc-job-start-outcome
"on":
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: tc-job-start-outcome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  outcome-browser:
    name: TC job-start / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: built
            origin: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/ci-node
      - id: scope
        name: Fail-closed TC change scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |-
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then base=HEAD^; fi
          git cat-file -e "$base^{commit}" || git fetch --no-tags --depth=1 origin "$base"
          node scripts/ci-changes.mjs "$base" "$HEAD"
      - name: Critical routing and release guard regressions
        run: node --test scripts/ci-changes.test.mjs scripts/cloudflare-deploy.test.mjs
      - name: Fetch the exact TC static baseline
        if: steps.scope.outputs.tc == 'true' && (matrix.label == 'built')
        run: |
          git fetch --no-tags --depth=1 origin 9e50404c0573e1cf9e2dd7e623c9c8bd98b95e56
          git fetch --no-tags --depth=1 origin 539df6ee8cd3fe1e56b4a7833bffcc8953765488
      - name: Pinned archive, import closure and fail-closed regressions
        if: steps.scope.outputs.tc == 'true' && (matrix.label == 'built')
        run: node --test scripts/tc-sim-job-start-baseline.test.mjs
      - name: Targeted outcome, origin and safe-server regressions
        run: node --test scripts/tc-sim-balance-final.test.mjs scripts/tc-sim-gameplay-language.test.mjs scripts/tc-sim-city-life.test.mjs scripts/tc-sim-marriage-depth.test.mjs scripts/tc-sim-household.test.mjs scripts/tc-sim-parenthood.test.mjs scripts/tc-sim-intimacy.test.mjs scripts/tc-sim-body-visual.test.mjs scripts/tc-sim-depth-4.test.mjs scripts/tc-sim-job-start-outcome.test.mjs scripts/tc-sim-job-start-target.test.mjs scripts/tc-sim-2-regions-target.test.mjs scripts/tc-sim-job-start-i18n.test.mjs scripts/tc-sim-job-start-layout.test.mjs scripts/tc-sim-weekly-feedback.test.mjs scripts/tc-sim-lifetime-ui.test.mjs scripts/static-game-server.test.mjs
        if: steps.scope.outputs.tc == 'true'
      - run: npm run build
        if: steps.scope.outputs.tc == 'true'
      - name: Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
        if: steps.scope.outputs.tc == 'true'
      - name: Same-browser cold static baseline and candidate comparison
        if: steps.scope.outputs.tc == 'true' && (matrix.label == 'built')
        run: node scripts/tc-sim-job-start-performance.mjs
      - name: Built candidate — 18 matrix cases and 4 mobile hidden-panel regressions
        if: steps.scope.outputs.tc == 'true' && (matrix.label == 'built')
        run: node scripts/tc-sim-job-start-outcome-browser.mjs --serve .output/public --label built
      - name: TC SIM 2.0 navigation, preferences and status
        if: steps.scope.outputs.tc == 'true' && (matrix.label == 'built')
        run: node scripts/tc-sim-2-ux-browser.mjs .output/public built
      - name: TC SIM 2 regions — 23 destinations, four viewports and three languages
        if: steps.scope.outputs.tc == 'true' && (matrix.label == 'built')
        run: node scripts/tc-sim-2-regions-browser.mjs --serve .output/public --expected-sha "${{ github.sha }}" --out "${{ runner.temp }}/screenshots/tc-sim-2-regions"
      - name: Mobile final — five viewports, all menus and gameplay controls
        if: steps.scope.outputs.tc == 'true' && (matrix.label == 'built')
        run: node scripts/tc-sim-job-start-mobile.mjs .output/public
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.tc == 'true'
        with:
          name: tc-sim-2-regions-${{ matrix.label }}
          path: ${{ runner.temp }}/screenshots/tc-sim-2-regions
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.tc == 'true'
        with:
          name: tc-mobile-final
          path: ${{ runner.temp }}/screenshots/tc-mobile-final
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.tc == 'true'
        with:
          name: tc-job-start-outcome-${{ matrix.label }}
          path: ${{ runner.temp }}/screenshots/tc-job-start-outcome/${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.tc == 'true'
        with:
          name: tc-job-start-outcome-performance
          path: ${{ runner.temp }}/screenshots/tc-job-start-outcome/performance
