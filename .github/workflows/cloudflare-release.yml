name: Cloudflare verified release
on:
  workflow_run:
    workflows: [ci, tc-job-start-outcome, Boardworld quality]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-verified-production-pointer
  queue: max
jobs:
  advance:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    steps:
      # workflow_run's github.sha is trusted default-branch code. Never check
      # out triggering branch code or execute its artifacts with this token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Advance only to verified current main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare-release.mjs
