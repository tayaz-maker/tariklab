name: ci
"on":
  push:
    branches:
      - main
  pull_request: null
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.route.outputs.docs }}
      tc: ${{ steps.route.outputs.tc }}
      full: ${{ steps.route.outputs.full }}
      browser: ${{ steps.route.outputs.browser }}
      routes: ${{ steps.route.outputs.routes }}
      devlet: ${{ steps.route.outputs.devlet }}
      duel: ${{ steps.route.outputs.duel }}
      campaign: ${{ steps.route.outputs.campaign }}
      balance: ${{ steps.route.outputs.balance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed patch
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: git diff --check "$BASE...$HEAD"
      - id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node scripts/ci-changes.mjs "$BASE" "$HEAD"
  build-core:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-node
      - run: npm run typecheck
        if: needs.changes.outputs.docs != 'true'
      - run: npm run lint
        if: needs.changes.outputs.docs != 'true'
      - run: npm run build
      - name: Package exact candidate once
        run: |-
          git rev-parse HEAD > .ci-build-sha
          tar -czf "$RUNNER_TEMP/build.tgz" .output .wrangler/deploy .ci-build-sha
      - uses: actions/upload-artifact@v4
        with:
          name: ci-build
          path: ${{ runner.temp }}/build.tgz
          retention-days: 7
          compression-level: 0
  browser-regression:
    needs:
      - changes
      - build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - wave1-save
          - wave1-outcome
          - cete
          - duel
          - devlet
          - responsive
          - tc
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-node
        if: needs.changes.outputs.browser == 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.browser == 'true'
        with:
          name: ci-build
          path: ${{ runner.temp }}/ci-build
      - name: Restore exact same-run build
        if: needs.changes.outputs.browser == 'true'
        run: |-
          tar -xzf "$RUNNER_TEMP/ci-build/build.tgz"
          test "$(cat .ci-build-sha)" = "$(git rev-parse HEAD)"
      - name: Install Chromium for responsive regression
        if: needs.changes.outputs.browser == 'true'
        timeout-minutes: 5
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Wave 1 save repairs in source and built games (TR/EN/PL, 390/1280)
        if: matrix.suite == 'wave1-save' && (needs.changes.outputs.full == 'true')
        timeout-minutes: 5
        run: |
          node scripts/wave1-save-browser.mjs --serve public --label source
          node scripts/wave1-save-browser.mjs --serve .output/public --label built
      - name: Wave 1 decisions, state traces and paired evidence
        if: matrix.suite == 'wave1-outcome' && (needs.changes.outputs.campaign == 'true' || needs.changes.outputs.full == 'true')
        timeout-minutes: 8
        run: |
          git fetch --no-tags --depth=1 origin 53534e2f9526ad80ce296952c212fa44aaa0ada1
          mkdir -p "$RUNNER_TEMP/wave1-before"
          git archive 53534e2f9526ad80ce296952c212fa44aaa0ada1 public | tar -x -C "$RUNNER_TEMP/wave1-before"
          node scripts/wave1-outcome-browser.mjs --serve "$RUNNER_TEMP/wave1-before/public" --baseline --label before
          node scripts/wave1-outcome-browser.mjs --serve public --label source
          node scripts/wave1-outcome-browser.mjs --serve .output/public --label built
      - name: Cete outcome moments (1440/390/320, motion, save and focus)
        if: matrix.suite == 'cete' && (needs.changes.outputs.full == 'true')
        timeout-minutes: 5
        run: |
          node --experimental-strip-types --import ./scripts/ts-alias.mjs scripts/cete-outcome-browser.mjs
          CETE_BUILD=1 CETE_LABEL=built node --experimental-strip-types --import ./scripts/ts-alias.mjs scripts/cete-outcome-browser.mjs
      - name: Duel archive, save and 2.5D responsive regression
        if: matrix.suite == 'duel' && (needs.changes.outputs.duel == 'true')
        timeout-minutes: 5
        run: node scripts/duel-browser.mjs
      - name: DEVLET map transition mobile regression
        if: matrix.suite == 'devlet' && (needs.changes.outputs.devlet == 'true')
        timeout-minutes: 5
        run: node scripts/devlet-map-transition-browser.mjs
      - name: Responsive and interaction regression (TR/EN, 16 live routes)
        if: matrix.suite == 'responsive' && (needs.changes.outputs.browser == 'true')
        timeout-minutes: 10
        run: node scripts/sitewide-responsive.mjs
        env:
          SITEWIDE_ROUTE_IDS: ${{ needs.changes.outputs.routes }}
      - name: TC SIM historical starts (1440, 390, 320 px; save, reload and 2026)
        if: matrix.suite == 'tc' && (needs.changes.outputs.tc == 'true')
        timeout-minutes: 10
        run: node scripts/tc-sim-historical-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
  build:
    if: ${{ always() }}
    needs:
      - changes
      - build-core
      - unit
      - browser-regression
      - campaign-browser
      - campaign-balance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require every build dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-required-gate.mjs
  campaign-browser:
    needs:
      - changes
      - build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-node
        if: needs.changes.outputs.campaign == 'true'
      - name: Install Chromium
        if: needs.changes.outputs.campaign == 'true'
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: HANEDANIAN desktop, touch and real offline reload
        if: needs.changes.outputs.campaign == 'true'
        run: node scripts/hanedanian-browser.mjs
        env:
          HANEDANIAN_SOAK_MS: "0"
      - name: IHTILAL first minute and five minute decision loop
        if: needs.changes.outputs.campaign == 'true' && !cancelled()
        run: node scripts/ihtilal-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-browser
          path: |
            ${{ runner.temp }}/screenshots/hanedanian
            ${{ runner.temp }}/screenshots/ihtilal
  campaign-balance:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Twenty deterministic seeds across all three victory routes
        if: needs.changes.outputs.balance == 'true'
        run: node scripts/hanedanian-campaign-probe.mjs
        env:
          PROBE_OUTPUT: campaign-balance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-balance
          path: campaign-balance*.json
  unit:
    needs:
      - changes
      - build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-node
        if: needs.changes.outputs.docs != 'true'
      - name: Affected critical unit tests
        if: needs.changes.outputs.docs != 'true'
        env:
          CI_FULL: ${{ needs.changes.outputs.full }}
          CI_ROUTES: ${{ needs.changes.outputs.routes }}
          CI_SHARD: ${{ matrix.shard }}
        run: node scripts/ci-test-plan.mjs
