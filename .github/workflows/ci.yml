name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Duel deterministic stress (500 per theme)
        timeout-minutes: 5
        run: node scripts/duel-stress.mjs 500
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for responsive regression
        timeout-minutes: 5
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Duel archive, save and 2.5D responsive regression
        timeout-minutes: 5
        run: node scripts/duel-browser.mjs
      - name: Upload duel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-responsive
          path: ${{ runner.temp }}/screenshots/duel
      - name: Responsive and interaction regression (TR/EN, 16 live routes)
        timeout-minutes: 10
        run: node scripts/sitewide-responsive.mjs
      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-responsive
          path: ${{ runner.temp }}/screenshots/tariklab-ux
      - name: Verify deployed duel assets, archives and legacy saves
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 8
        run: node scripts/duel-production.mjs
      - name: Upload production duel evidence
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: duel-production
          path: ${{ runner.temp }}/screenshots/duel-production
  campaign-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: HANEDANIAN desktop, touch and real offline reload
        run: node scripts/hanedanian-browser.mjs
      - name: IHTILAL first minute and five minute decision loop
        if: '!cancelled()'
        run: node scripts/ihtilal-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-browser
          path: |
            ${{ runner.temp }}/screenshots/hanedanian
            ${{ runner.temp }}/screenshots/ihtilal
  campaign-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Twenty deterministic seeds across all three victory routes
        run: node scripts/hanedanian-campaign-probe.mjs
        env:
          PROBE_OUTPUT: campaign-balance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-balance
          path: campaign-balance.json
