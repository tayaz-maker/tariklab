name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.route.outputs.full }}
      browser: ${{ steps.route.outputs.browser }}
      routes: ${{ steps.route.outputs.routes }}
      devlet: ${{ steps.route.outputs.devlet }}
      duel: ${{ steps.route.outputs.duel }}
      campaign: ${{ steps.route.outputs.campaign }}
      balance: ${{ steps.route.outputs.balance }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node scripts/ci-changes.mjs "$BASE" "$HEAD"
  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Duel deterministic stress (500 per theme)
        timeout-minutes: 5
        run: node scripts/duel-stress.mjs 500
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for responsive regression
        timeout-minutes: 5
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Duel archive, save and 2.5D responsive regression
        if: needs.changes.outputs.duel == 'true'
        timeout-minutes: 5
        run: node scripts/duel-browser.mjs
      - name: DEVLET map transition mobile regression
        if: needs.changes.outputs.devlet == 'true'
        timeout-minutes: 5
        run: node scripts/devlet-map-transition-browser.mjs
      - name: Upload duel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-responsive
          path: ${{ runner.temp }}/screenshots/duel
      - name: Responsive and interaction regression (TR/EN, 16 live routes)
        if: needs.changes.outputs.browser == 'true'
        timeout-minutes: 10
        run: node scripts/sitewide-responsive.mjs
        env:
          SITEWIDE_ROUTE_IDS: ${{ needs.changes.outputs.routes }}
      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-responsive
          path: ${{ runner.temp }}/screenshots/tariklab-ux
      - name: Verify deployed duel assets, archives and legacy saves
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 8
        run: node scripts/duel-production.mjs
      - name: Upload production duel evidence
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: duel-production
          path: ${{ runner.temp }}/screenshots/duel-production
  campaign-browser:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: HANEDANIAN desktop, touch and real offline reload
        if: needs.changes.outputs.campaign == 'true'
        run: node scripts/hanedanian-browser.mjs
        env:
          HANEDANIAN_SOAK_MS: ${{ github.ref == 'refs/heads/main' && '0' || '1200000' }}
      - name: IHTILAL first minute and five minute decision loop
        if: needs.changes.outputs.campaign == 'true' && !cancelled()
        run: node scripts/ihtilal-browser.mjs
      - name: Verify exact production game code and both games in Chromium
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 12
        run: node scripts/campaign-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-browser
          path: |
            ${{ runner.temp }}/screenshots/hanedanian
            ${{ runner.temp }}/screenshots/ihtilal
  campaign-balance:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Twenty deterministic seeds across all three victory routes
        if: needs.changes.outputs.balance == 'true'
        run: node scripts/hanedanian-campaign-probe.mjs
        env:
          PROBE_OUTPUT: campaign-balance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-balance
          path: campaign-balance*.json
