name: racon-quality
on:
  pull_request:
    paths:
      - public/games/racon/**
      - scripts/racon-*.mjs
      - .github/workflows/racon-quality.yml
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/racon-*.test.mjs
      - run: node scripts/racon-longrun.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - run: node scripts/racon-quality-browser.mjs --source
      - run: node scripts/racon-quality-browser.mjs
      - run: node scripts/racon-map-browser.mjs --serve .output/public --label build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racon-quality
          path: ${{ runner.temp }}/screenshots
