name: hanedanian-redirect

on:
  pull_request:
    paths:
      - public/games/hanedanian/**
      - scripts/hanedanian-redirect-browser.mjs
      - scripts/hanedanian-release-smoke.mjs
      - scripts/hanedanian-redirect-transport.mjs
      - scripts/hanedanian-redirect-transport.test.mjs
      - scripts/hanedanian-offline.test.mjs
      - scripts/offline-sw-plugin.mjs
      - .github/workflows/hanedanian-redirect.yml
  push:
    branches: [main]
    paths:
      - public/games/hanedanian/**
      - scripts/hanedanian-redirect-browser.mjs
      - scripts/hanedanian-release-smoke.mjs
      - .github/workflows/hanedanian-redirect.yml
  workflow_dispatch:

jobs:
  local-redirect-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Atomic offline package unit regressions
        run: node --test scripts/hanedanian-offline.test.mjs scripts/offline-sw-plugin.test.mjs scripts/hanedanian-redirect-transport.test.mjs
      - run: npm run build
      - name: Fetch immutable failing worker only
        run: git fetch --no-tags --depth=1 origin 562831dba3b16be2a0bc8b2aec2e613eb1b80f45
      - name: Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Real local HTTP307 baseline failure and fixed online/offline reload
        timeout-minutes: 3
        run: node scripts/hanedanian-redirect-browser.mjs
      - name: Exact candidate on Workers preview (1440, 390, 320)
        if: github.event_name == 'pull_request' && github.head_ref == 'astra/han-offline-redirect-fix'
        timeout-minutes: 3
        run: |
          worker_sha="$(sha256sum .output/public/games/hanedanian/sw.js | cut -d ' ' -f 1)"
          node scripts/hanedanian-release-smoke.mjs --base-url https://astra-han-offline-redirect-fix-tariklab.tayaz29.workers.dev --expected-worker-sha "$worker_sha"
      - name: Exact released worker on both production hosts (1440, 390, 320)
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: |
          worker_sha="$(sha256sum .output/public/games/hanedanian/sw.js | cut -d ' ' -f 1)"
          node scripts/hanedanian-release-smoke.mjs --base-url https://www.tariklab.com --expected-worker-sha "$worker_sha"
          node scripts/hanedanian-release-smoke.mjs --base-url https://tariklab.tayaz29.workers.dev --expected-worker-sha "$worker_sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanedanian-redirect
          path: ${{ runner.temp }}/screenshots/hanedanian-redirect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanedanian-hosted-preview
          path: ${{ runner.temp }}/screenshots/han-release-astra-han-offline-redirect-fix-tariklab.tayaz29.workers.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanedanian-production-www
          path: ${{ runner.temp }}/screenshots/han-release-www.tariklab.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanedanian-production-workers
          path: ${{ runner.temp }}/screenshots/han-release-tariklab.tayaz29.workers.dev
