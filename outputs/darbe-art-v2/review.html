<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src 'self' data: blob:; base-uri 'none'; form-action 'none'"><title>DARBE-H! · CSS genişlik incelemesi</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#121820;color:#e8dcc4;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.review-header{padding:16px 20px;border-bottom:1px solid #8a6a3a;background:#1a2433}.review-header h1{font:700 23px/1.2 Georgia,serif;margin:0 0 8px}.review-header p{margin:6px 0;color:#b7c0c9}.review-controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.review-controls button{font:inherit;cursor:pointer;min-width:72px;min-height:44px;padding:8px 14px;border:1px solid #8a6a3a;border-radius:4px;background:#243044;color:#e8dcc4}.review-controls button[aria-pressed=true]{background:#d8dde4;color:#121820;border-color:#d8dde4}.review-controls button:focus-visible{outline:3px solid #e8dcc4;outline-offset:3px}#review-status{font-variant-numeric:tabular-nums;color:#e8dcc4}.review-stage{padding:16px 10px;overflow:hidden}.review-frame-shell{position:relative;margin:auto;background:#121820;outline:1px solid #8a6a3a}iframe{display:block;position:absolute;left:0;top:0;border:0;transform-origin:top left;background:#121820}@media(max-width:390px){.review-header{padding:12px}.review-header h1{font-size:20px}.review-stage{padding:12px 0}}</style></head><body><header class="review-header"><h1>DARBE-H! · genişlik incelemesi</h1><p>Düğmeler iç sayfanın CSS viewport genişliğini ayarlar. Bu, cihaz emülasyonu değildir. Geniş görünüm pencereye sığacak ölçekte gösterilir.</p><div class="review-controls" role="group" aria-label="İç sayfa CSS genişliği"><button type="button" data-width="320" aria-pressed="false">320 px</button><button type="button" data-width="390" aria-pressed="false">390 px</button><button type="button" data-width="1440" aria-pressed="true">1440 px</button></div><p id="review-status" role="status" aria-live="polite"></p></header><main class="review-stage"><div class="review-frame-shell"><iframe id="review-frame" title="10 kartlık DARBE-H! görsel incelemesi" sandbox="allow-scripts"></iframe></div></main><script>var source="\u003c!doctype html>\u003chtml lang=\"tr\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'\">\u003ctitle>DARBE-H! · 10 kart görsel incelemesi\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--card-ratio: 59 / 86;font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif;font-size:16px;line-height:1.5}\nbody[data-theme=\"darbe-h\"] {\n  /* DARBE-H!: briefing room — ink navy, telex amber, cool grey paper,\n     stamp crimson used only as warning. Not İHTİLAL cream, not VETO green. */\n  --background: #121820;\n  --surface: #1a2433;\n  --surface-raised: #243044;\n  --table: #1e2a38;\n  --foreground: #e8dcc4;\n  --muted: #b7c0c9;\n  --brass: #c4a574;\n  --accent: #7a93a8;\n  --red: #c17a72;\n  --paper: #d8dde4;\n  --ink: #121820;\n  --line: #c4a5743a;\n  --frame-edge: #8a6a3a;\n  --radius-table: 8px;\n  background:\n    radial-gradient(1200px 700px at 50% 0%, #243044cc, #121820f2),\n    repeating-linear-gradient(180deg, #1a243300 0 22px, #c4a5740d 22px 23px);\n}\n*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground)}[hidden]{display:none!important}button{font:inherit;min-height:44px;min-width:44px;cursor:pointer}button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}\n.proof-header,.proof-main{max-width:1440px;margin:auto;padding:24px}.proof-header{border-bottom:1px solid var(--frame-edge)}.proof-kicker,.proof-id{color:var(--brass);letter-spacing:.1em;font-size:12px;font-weight:700}.proof-header h1{font:700 clamp(27px,3vw,42px)/1.15 Georgia,serif;margin:8px 0 12px}.proof-intro{max-width:850px;color:var(--foreground);margin:0}.proof-context{font-size:13px;color:var(--muted);margin:10px 0 0}.proof-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}.proof-toolbar span{font-size:13px;color:var(--muted);margin-right:8px}.proof-toggle{border:1px solid var(--frame-edge);border-radius:4px;background:var(--surface);color:var(--foreground);padding:8px 14px}.proof-toggle[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n.proof-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.proof-entry{min-width:0;border:1px solid var(--frame-edge);border-radius:8px;padding:20px;background:var(--surface)}.proof-card-heading{margin-bottom:18px}.proof-id{margin:0 0 5px}.proof-card-heading h2{font:700 24px/1.2 Georgia,serif;margin:0;overflow-wrap:anywhere}.proof-comparisons{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}.proof-variant{margin:0;min-width:0}.proof-variant figcaption{font-size:13px;color:var(--muted);margin-bottom:10px}.proof-visuals{display:grid;grid-template-columns:minmax(0,177px) minmax(0,1fr);gap:24px;align-items:center}.proof-face{width:177px;max-width:100%;justify-self:center}.proof-face .playing-card{width:100%;aspect-ratio:var(--card-ratio);margin:0;min-height:0}.proof-scene{min-width:0;text-align:center}.proof-scene img{display:block;width:240px;max-width:100%;height:auto;aspect-ratio:3/2;margin:auto;border:1px solid var(--frame-edge)}.proof-scene p{font-size:12px;color:var(--muted);margin:8px 0 0}.proof-rules{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.proof-rules h3{font-size:13px;margin:0 0 6px;color:var(--brass)}.proof-rules p{font-size:15px;line-height:1.55;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:none;overflow:visible}.proof-rules .proof-rule-note{margin-top:8px;color:var(--muted)}.proof-notes{font-size:13px;margin:18px 0 0;display:grid;gap:8px}.proof-notes div{display:grid;grid-template-columns:106px minmax(0,1fr);gap:10px}.proof-notes dt{color:var(--muted)}.proof-notes dd{margin:0;overflow-wrap:anywhere}.proof-footer{max-width:1440px;margin:auto;padding:0 24px 28px;color:var(--muted);font-size:12px}\nbody[data-proof-mode=both] .proof-comparisons{grid-template-columns:repeat(2,minmax(0,1fr))}body[data-proof-mode=both] .proof-visuals{grid-template-columns:minmax(0,1fr);gap:14px}\n@media(max-width:1050px){.proof-gallery{grid-template-columns:minmax(0,1fr)}}\n@media(max-width:560px){.proof-header,.proof-main{padding:16px 12px}.proof-entry{padding:14px}.proof-gallery{gap:16px}.proof-visuals{grid-template-columns:minmax(0,1fr);gap:14px}.proof-card-heading h2{font-size:22px}.proof-notes div{grid-template-columns:minmax(0,1fr);gap:2px}.proof-notes dt{font-weight:600}.proof-toolbar{gap:6px}.proof-toolbar span{width:100%}body[data-proof-mode=both] .proof-comparisons{grid-template-columns:minmax(0,1fr);gap:24px}.proof-footer{padding:0 12px 20px}}\n\u003c/style>\u003cstyle data-original-card-face-css=\"658abcd9ac640fd3c501a7526b40f4bec744f29caf9cfd21120a848e88496e1e\">/* DARBE-H! card faces.\n   Only what is inside a .playing-card is designed here. Outer width, height,\n   aspect ratio and every slot on the table keep their duel-core sizes, and\n   all colours are the existing DARBE-H! tokens from design.css. */\nbody[data-theme=\"darbe-h\"] .playing-card {\n  --dh-kind: var(--accent);\n  --dh-sans: system-ui, -apple-system, \"Segoe UI\", Roboto, \"Noto Sans\", \"DejaVu Sans\", sans-serif;\n  container-type: inline-size;\n  display: grid;\n  grid-template-rows: auto minmax(0, 1fr) auto auto;\n  gap: 3px;\n  padding: 7px 4px 4px;\n  border: 1px solid var(--frame-edge);\n  border-radius: 6px;\n  background: linear-gradient(180deg, var(--surface-raised), var(--surface) 70%);\n  color: var(--foreground);\n  text-align: left;\n  overflow: hidden;\n  box-shadow:\n    inset 0 3px 0 var(--dh-kind),\n    inset 0 0 0 1px #c4a57426,\n    0 4px 8px #0009;\n  transition:\n    transform 140ms ease,\n    box-shadow 140ms ease,\n    border-color 140ms ease,\n    opacity 140ms ease;\n}\nbody[data-theme=\"darbe-h\"] .playing-card[data-kind=\"spell\"] {\n  --dh-kind: var(--brass);\n}\nbody[data-theme=\"darbe-h\"] .playing-card[data-kind=\"trap\"] {\n  --dh-kind: var(--red);\n}\n\n/* duel-core paints hovered and selected cards paper-white; DARBE-H! faces\n   keep their own ground in every state so the name never loses contrast. */\nbody[data-theme=\"darbe-h\"] .playing-card:not(.face-down):is(:hover, :focus, .selected) {\n  background: linear-gradient(180deg, var(--surface-raised), var(--surface) 70%);\n  color: var(--foreground);\n}\nbody[data-theme=\"darbe-h\"] .playing-card.face-down:is(:hover, :focus, .selected) {\n  background:\n    repeating-linear-gradient(90deg, #1a2433 0 6px, #243044 6px 7px),\n    repeating-linear-gradient(0deg, #121820 0 10px, #1a2433 10px 11px);\n}\n\n/* 1 · name and rank */\nbody[data-theme=\"darbe-h\"] .dh-head {\n  display: flex;\n  align-items: flex-start;\n  gap: 4px;\n  min-width: 0;\n}\nbody[data-theme=\"darbe-h\"] .dh-name {\n  flex: 1;\n  min-width: 0;\n  min-height: 2.24em;\n  display: -webkit-box;\n  -webkit-line-clamp: 2;\n  -webkit-box-orient: vertical;\n  overflow: hidden;\n  overflow-wrap: anywhere;\n  font:\n    700 clamp(10.5px, 9.2cqw, 15px) / 1.12 Georgia,\n    \"Times New Roman\",\n    serif;\n  color: var(--foreground);\n}\nbody[data-theme=\"darbe-h\"] .dh-rank {\n  flex: none;\n  padding: 2px 5px;\n  border-radius: 999px;\n  background: var(--brass);\n  color: var(--ink);\n  font: 800 clamp(10px, 8cqw, 13px) / 1 var(--dh-sans);\n  font-variant-numeric: tabular-nums;\n}\n\n/* 2 · illustration with kind tab and bureau stamp */\nbody[data-theme=\"darbe-h\"] .dh-art {\n  position: relative;\n  min-height: 0;\n  border-radius: 3px;\n  overflow: hidden;\n  background: var(--ink);\n  box-shadow: 0 0 0 1px #0009;\n}\nbody[data-theme=\"darbe-h\"] .dh-art img {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\nbody[data-theme=\"darbe-h\"] .dh-kind {\n  position: absolute;\n  left: 0;\n  bottom: 0;\n  display: flex;\n  align-items: center;\n  gap: 3px;\n  max-width: 100%;\n  padding: 2px 6px 2px 4px;\n  border-top-right-radius: 3px;\n  background: var(--dh-kind);\n  color: var(--ink);\n  font: 800 clamp(8.5px, 6.6cqw, 11px) / 1.1 var(--dh-sans);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  white-space: nowrap;\n}\nbody[data-theme=\"darbe-h\"] .dh-glyph svg {\n  display: block;\n  width: 1.1em;\n  height: 1.1em;\n  fill: currentColor;\n}\nbody[data-theme=\"darbe-h\"] .dh-bureau {\n  position: absolute;\n  top: 3px;\n  right: 3px;\n  padding: 1px 3px;\n  border: 1px solid #c4a57480;\n  border-radius: 2px;\n  background: #121820d9;\n  color: var(--foreground);\n  font:\n    700 clamp(8px, 6cqw, 10px) / 1.1 ui-monospace,\n    \"DejaVu Sans Mono\",\n    monospace;\n  letter-spacing: 0.08em;\n}\n\n/* 3 · what the card does, in two words */\nbody[data-theme=\"darbe-h\"] .dh-effect {\n  display: flex;\n  gap: 4px;\n  min-width: 0;\n  overflow: hidden;\n  white-space: nowrap;\n  font: 650 clamp(10.5px, 8.6cqw, 12.5px) / 1.2 var(--dh-sans);\n  color: var(--foreground);\n}\nbody[data-theme=\"darbe-h\"] .dh-effect > * {\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\nbody[data-theme=\"darbe-h\"] .dh-effect em {\n  flex: none;\n  font-style: normal;\n  color: var(--brass);\n}\nbody[data-theme=\"darbe-h\"] .dh-effect .dh-plain {\n  color: var(--muted);\n  font-weight: 500;\n}\n\n/* 4 · stats, or type for orders and notices */\nbody[data-theme=\"darbe-h\"] .dh-info {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 3px;\n}\nbody[data-theme=\"darbe-h\"] .dh-stat {\n  display: grid;\n  justify-items: center;\n  gap: 1px;\n  min-width: 0;\n  padding: 2px 2px 3px;\n  border-radius: 3px;\n  background: var(--ink);\n  white-space: nowrap;\n}\nbody[data-theme=\"darbe-h\"] .dh-stat small {\n  font: 700 clamp(8.5px, 6.6cqw, 10px) / 1 var(--dh-sans);\n  letter-spacing: 0.06em;\n  color: var(--muted);\n}\nbody[data-theme=\"darbe-h\"] .dh-stat b {\n  font: 800 clamp(11.5px, 10.4cqw, 16px) / 1 var(--dh-sans);\n  font-variant-numeric: tabular-nums;\n  color: var(--foreground);\n}\nbody[data-theme=\"darbe-h\"] .dh-stat.up b {\n  color: var(--brass);\n}\nbody[data-theme=\"darbe-h\"] .dh-stat.up b::after {\n  content: \"▲\";\n  font-size: 0.6em;\n  margin-left: 1px;\n}\nbody[data-theme=\"darbe-h\"] .dh-stat.down b {\n  color: var(--red);\n}\nbody[data-theme=\"darbe-h\"] .dh-stat.down b::after {\n  content: \"▼\";\n  font-size: 0.6em;\n  margin-left: 1px;\n}\nbody[data-theme=\"darbe-h\"] .zone .playing-card.defense .dh-stat:first-child {\n  opacity: 0.55;\n}\nbody[data-theme=\"darbe-h\"] .zone .playing-card.defense .dh-stat:last-child {\n  box-shadow: inset 0 0 0 1px var(--accent);\n}\nbody[data-theme=\"darbe-h\"] .dh-info-type {\n  grid-template-columns: 1fr;\n  text-align: center;\n  align-items: center;\n  padding: 2px 4px;\n  border-radius: 3px;\n  background: var(--ink);\n  font: 800 clamp(9.5px, 7.6cqw, 12px) / 1.1 var(--dh-sans);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n}\nbody[data-theme=\"darbe-h\"] .dh-subtype {\n  color: var(--dh-kind);\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\nbody[data-theme=\"darbe-h\"] .dh-kind-short {\n  display: none;\n}\n\n/* Face-down: one dossier back for every card, carrying the existing emblem. */\nbody[data-theme=\"darbe-h\"] .playing-card.face-down {\n  display: grid;\n  grid-template-rows: 1fr;\n  place-items: center;\n  padding: 4px;\n  background:\n    repeating-linear-gradient(90deg, #1a2433 0 6px, #243044 6px 7px),\n    repeating-linear-gradient(0deg, #121820 0 10px, #1a2433 10px 11px);\n  box-shadow:\n    inset 0 0 0 3px var(--surface),\n    inset 0 0 0 4px #c4a57455,\n    0 4px 8px #0009;\n}\nbody[data-theme=\"darbe-h\"] .dh-back {\n  display: grid;\n  place-items: center;\n  width: min(62%, 64px);\n  aspect-ratio: 1;\n  border: 1px solid #c4a57477;\n  border-radius: 50%;\n  background: var(--surface);\n}\nbody[data-theme=\"darbe-h\"] .dh-back img {\n  width: 70%;\n  height: auto;\n}\n\n/* ---- sizes: the same card, read at the space each surface gives it ---- */\n/* Board slots: name, picture, stats. The summary moves to Kart Ayrıntısı. */\nbody[data-theme=\"darbe-h\"] .zone .playing-card {\n  container-type: size;\n  padding: 5px 3px 3px;\n  gap: 2px;\n}\nbody[data-theme=\"darbe-h\"] .zone .dh-effect,\nbody[data-theme=\"darbe-h\"] .zone .dh-bureau,\nbody[data-theme=\"darbe-h\"] .zone .dh-kind-word,\nbody[data-theme=\"darbe-h\"] .zone .dh-rank {\n  display: none;\n}\nbody[data-theme=\"darbe-h\"] .zone .dh-name {\n  font-size: clamp(10px, 10cqw, 13px);\n}\nbody[data-theme=\"darbe-h\"] .zone .dh-info {\n  align-self: end;\n}\nbody[data-theme=\"darbe-h\"] .zone .dh-stat small {\n  display: none;\n}\nbody[data-theme=\"darbe-h\"] .zone .dh-stat {\n  padding: 2px 1px;\n}\nbody[data-theme=\"darbe-h\"] .zone .dh-stat b {\n  font-size: clamp(10px, 11cqw, 13px);\n}\nbody[data-theme=\"darbe-h\"] .zone .dh-info-type {\n  grid-template-columns: 1fr;\n  text-align: center;\n}\nbody[data-theme=\"darbe-h\"] .zone .dh-kind-short {\n  display: none;\n}\n/* Squat mobile slots: drop the picture before the name or numbers shrink. */\n@container (max-height: 96px) {\n  body[data-theme=\"darbe-h\"] .zone .dh-art {\n    display: none;\n  }\n}\nbody[data-theme=\"darbe-h\"] .support-row .playing-card {\n  grid-template-rows: 1fr;\n  align-items: center;\n}\nbody[data-theme=\"darbe-h\"] .support-row .dh-art,\nbody[data-theme=\"darbe-h\"] .support-row .dh-info,\nbody[data-theme=\"darbe-h\"] .support-row .dh-effect {\n  display: none;\n}\nbody[data-theme=\"darbe-h\"] .support-row .dh-name {\n  min-height: 0;\n}\nbody[data-theme=\"darbe-h\"] .support-row .playing-card.face-down {\n  padding: 3px;\n}\nbody[data-theme=\"darbe-h\"] .support-row .dh-back {\n  width: auto;\n  height: auto;\n  aspect-ratio: auto;\n  padding: 1px 10px;\n  border-radius: 3px;\n}\nbody[data-theme=\"darbe-h\"] .support-row .dh-back img {\n  width: auto;\n  height: min(20px, 60cqw);\n}\n\n/* Kart Ayrıntısı shows the name above the card, so the face leads with art. */\nbody[data-theme=\"darbe-h\"] .inspector .playing-card,\nbody[data-theme=\"darbe-h\"] .inspector-sheet .playing-card {\n  grid-template-rows: auto auto auto;\n  padding: 8px 6px 6px;\n}\nbody[data-theme=\"darbe-h\"] .inspector .dh-head,\nbody[data-theme=\"darbe-h\"] .inspector-sheet .dh-head {\n  display: none;\n}\nbody[data-theme=\"darbe-h\"] .inspector .dh-art,\nbody[data-theme=\"darbe-h\"] .inspector-sheet .dh-art {\n  aspect-ratio: 3 / 2;\n  height: auto;\n}\n\n/* ---- interaction states ---- */\n@media (hover: hover) {\n  body[data-theme=\"darbe-h\"] .playing-card:not(.face-down):not(:disabled):hover {\n    transform: translateY(-3px);\n    border-color: var(--brass);\n    box-shadow:\n      inset 0 3px 0 var(--dh-kind),\n      inset 0 0 0 1px #c4a57455,\n      0 8px 14px #000b;\n  }\n}\nbody[data-theme=\"darbe-h\"] button.playing-card:not(:disabled):active {\n  transform: translateY(-1px) scale(0.97);\n  transition-duration: 60ms;\n}\nbody[data-theme=\"darbe-h\"] .playing-card:focus-visible {\n  outline: 2px solid var(--foreground);\n  outline-offset: 2px;\n}\nbody[data-theme=\"darbe-h\"] .playing-card.selected {\n  transform: translateY(-5px);\n  border-color: var(--brass);\n  outline: 2px solid var(--brass);\n  outline-offset: 2px;\n  box-shadow:\n    inset 0 3px 0 var(--dh-kind),\n    inset 0 -4px 0 var(--brass),\n    0 0 16px #c4a57466,\n    0 8px 14px #000b;\n  z-index: 2;\n}\nbody[data-theme=\"darbe-h\"] .playing-card.valid-target {\n  outline: 2px dashed var(--accent);\n  outline-offset: 2px;\n}\nbody[data-theme=\"darbe-h\"] .playing-card[data-response-ready=\"true\"] {\n  border-color: var(--red);\n  box-shadow:\n    inset 0 3px 0 var(--dh-kind),\n    inset 0 0 0 2px #c17a7299,\n    0 4px 8px #0009;\n}\n/* Not playable right now: still readable and still opens Kart Ayrıntısı. */\nbody[data-theme=\"darbe-h\"] .hand-row .playing-card[data-playable=\"false\"]:not(.selected),\nbody[data-theme=\"darbe-h\"] .playing-card:disabled {\n  filter: saturate(0.5);\n  opacity: 0.8;\n  border-style: dashed;\n  box-shadow:\n    inset 0 3px 0 #b7c0c955,\n    0 2px 4px #0008;\n}\nbody[data-theme=\"darbe-h\"] .playing-card:disabled {\n  cursor: not-allowed;\n}\n@media (prefers-reduced-motion: reduce) {\n  body[data-theme=\"darbe-h\"] .playing-card {\n    transition: none;\n  }\n  body[data-theme=\"darbe-h\"] .playing-card.selected,\n  body[data-theme=\"darbe-h\"] .playing-card:hover,\n  body[data-theme=\"darbe-h\"] button.playing-card:active {\n    transform: none;\n  }\n}\n\u003c/style>\u003cstyle>body[data-theme=\"darbe-h\"] .proof-face .playing-card{transition:none!important;animation:none!important;transform:none!important;pointer-events:none}body[data-theme=\"darbe-h\"] .proof-face .playing-card:hover{border-color:var(--frame-edge);box-shadow:inset 0 3px 0 var(--dh-kind),inset 0 0 0 1px #c4a57426,0 4px 8px #0009}\u003c/style>\u003c/head>\u003cbody data-theme=\"darbe-h\" data-proof-mode=\"new\">\u003cheader class=\"proof-header\">\u003cp class=\"proof-kicker\">DARBE-H! · GÖRSEL İNCELEME · 10 KART\u003c/p>\u003ch1>Kartların içindeki sahne\u003c/h1>\u003cp class=\"proof-intro\">Yeni çizimleri mevcut kart yüzünün içinde ve 240 × 160 tam sahnede karşılaştırın. Kart adları, sayılar ve kart metinleri mevcut tanımlardan gelir.\u003c/p>\u003cp class=\"proof-context\">Bu dosya bir görsel öneri incelemesidir. Düello başlatmaz, kayıt oluşturmaz ve oyunun çevrimdışı çalıştığını doğrulamaz.\u003c/p>\u003cdiv class=\"proof-toolbar\" role=\"group\" aria-label=\"Çizim karşılaştırması\">\u003c
